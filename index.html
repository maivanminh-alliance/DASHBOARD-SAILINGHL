<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Dashboard Tổng Hợp · Sailing Hạ Long</title>
<style>
/* ══════════════ iOS DESIGN SYSTEM ══════════════ */
:root{
  --bg:#F2F2F7; --card:#FFFFFF; --card2:#FFFFFF; --group:#EFEFF4;
  --sep:rgba(60,60,67,.13); --sep2:rgba(60,60,67,.07);
  --label:#000000; --label2:rgba(60,60,67,.6); --label3:rgba(60,60,67,.3);
  --fill:rgba(118,118,128,.12); --fill2:rgba(118,118,128,.08);
  --blue:#007AFF; --green:#34C759; --orange:#FF9500; --red:#FF3B30;
  --purple:#AF52DE; --teal:#5AC8FA; --indigo:#5856D6; --pink:#FF2D55; --gray:#8E8E93;
  --c1:#007AFF; --c2:#34C759; --c3:#FF9500; --c4:#FF3B30; --c5:#AF52DE;
  --c6:#5AC8FA; --c7:#30D158; --c8:#FF2D55; --c9:#C7C7CC;
  --okbg:rgba(52,199,89,.14); --warnbg:rgba(255,149,0,.15); --badbg:rgba(255,59,48,.13);
  --infobg:rgba(0,122,255,.12); --mutebg:rgba(118,118,128,.12);
  --oktx:#248A3D; --warntx:#B25000; --badtx:#D70015; --infotx:#0040DD;
  --nav:rgba(249,249,251,.8); --shadow:0 1px 2px rgba(0,0,0,.04);
  --r:18px; --rail:236px; --fpw:280px;
}
[data-theme="dark"]{
  --bg:#000000; --card:#1C1C1E; --card2:#2C2C2E; --group:#1C1C1E;
  --sep:rgba(84,84,88,.6); --sep2:rgba(84,84,88,.3);
  --label:#FFFFFF; --label2:rgba(235,235,245,.6); --label3:rgba(235,235,245,.3);
  --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.18);
  --blue:#0A84FF; --green:#30D158; --orange:#FF9F0A; --red:#FF453A;
  --purple:#BF5AF2; --teal:#64D2FF; --indigo:#5E5CE6; --pink:#FF375F; --gray:#98989D;
  --c1:#0A84FF; --c2:#30D158; --c3:#FF9F0A; --c4:#FF453A; --c5:#BF5AF2;
  --c6:#64D2FF; --c7:#32D74B; --c8:#FF375F; --c9:#48484A;
  --okbg:rgba(48,209,88,.18); --warnbg:rgba(255,159,10,.18); --badbg:rgba(255,69,58,.18);
  --infobg:rgba(10,132,255,.18); --mutebg:rgba(118,118,128,.24);
  --oktx:#30D158; --warntx:#FF9F0A; --badtx:#FF453A; --infotx:#0A84FF;
  --nav:rgba(28,28,30,.8); --shadow:none;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','SF Pro Display','Helvetica Neue',Inter,'Segoe UI',sans-serif;
  background:var(--bg);color:var(--label);font-size:15px;line-height:1.35;letter-spacing:-.01em;
  -webkit-font-smoothing:antialiased;overflow:hidden}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;letter-spacing:inherit}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:rgba(140,140,150,.35);border-radius:6px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:rgba(140,140,150,.6);background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}

/* ══════════════ LAYOUT ══════════════ */
.app{display:grid;grid-template-columns:var(--rail) 1fr;height:100vh;transition:grid-template-columns .22s cubic-bezier(.32,.72,.35,1)}
.app.collapsed{--rail:0px}
.app.nofilter{--fpw:0px}

/* ── Sidebar ── */
.rail{background:var(--group);border-right:.5px solid var(--sep);display:flex;flex-direction:column;overflow:hidden;user-select:none}
[data-theme="dark"] .rail{background:#000}
.brand{padding:18px 18px 10px}
.brand b{display:block;font-size:20px;font-weight:700;letter-spacing:-.024em;white-space:nowrap}
.brand span{display:block;color:var(--label2);font-size:12px;margin-top:1px;white-space:nowrap}
.navlist{flex:1;overflow-y:auto;padding:6px 10px 12px}
.navsec{color:var(--label2);font-size:11px;font-weight:600;letter-spacing:.02em;padding:14px 10px 4px;white-space:nowrap}
.navitem{display:block;padding:9px 12px;border-radius:10px;color:var(--label);font-size:14.5px;
  cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:background .12s}
.navitem:hover{background:var(--fill2)}
.navitem.on{background:var(--blue);color:#fff;font-weight:600}
.railfoot{padding:8px 10px 14px;border-top:.5px solid var(--sep)}
.railbtn{display:block;width:100%;text-align:left;padding:8px 12px;border-radius:10px;color:var(--blue);font-size:14px}
.railbtn:hover{background:var(--fill2)}

/* ── Main ── */
.main{display:flex;flex-direction:column;min-width:0;overflow:hidden}
.topbar{background:var(--nav);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  border-bottom:.5px solid var(--sep);padding:0 22px;height:56px;display:flex;align-items:center;gap:12px;flex-shrink:0}
.ptitle{font-size:22px;font-weight:700;letter-spacing:-.022em}
.tbspacer{flex:1}
.tbtn{padding:7px 14px;border-radius:980px;font-size:14px;color:var(--blue);background:var(--fill);white-space:nowrap;font-weight:500}
.tbtn:hover{background:var(--fill2)}
.tbtn.pri{background:var(--blue);color:#fff;font-weight:600;display:inline-flex;align-items:center;gap:7px}
.lv{width:7px;height:7px;border-radius:50%;background:#5CF08A;box-shadow:0 0 0 0 rgba(92,240,138,.7);
  animation:pulse 2.4s ease-out infinite;flex-shrink:0}
.lv.warn{background:#FFD60A;animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(92,240,138,.65)}70%{box-shadow:0 0 0 7px rgba(92,240,138,0)}100%{box-shadow:0 0 0 0 rgba(92,240,138,0)}}
.tbtn.pri:hover{filter:brightness(1.08)}
.tbtn:disabled{opacity:.5}
.sync{font-size:12.5px;color:var(--label2);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--gray);display:block}

.body{flex:1;display:grid;grid-template-columns:1fr var(--fpw);min-height:0;transition:grid-template-columns .22s cubic-bezier(.32,.72,.35,1)}
.canvas{overflow-y:auto;padding:18px 22px 60px;min-width:0}

/* ── Filter pane ── */
.fpane{background:var(--group);border-left:.5px solid var(--sep);overflow-y:auto;overflow-x:hidden}
[data-theme="dark"] .fpane{background:#000}
.nofilter .fpane{display:none}
.fhead{padding:16px 18px 8px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.fhead b{font-size:19px;font-weight:700;letter-spacing:-.02em}
.fgroup{padding:12px 18px}
.fgroup .fl{font-size:12px;font-weight:600;color:var(--label2);margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:6px 13px;border-radius:980px;font-size:13.5px;color:var(--label);background:var(--card);
  white-space:nowrap;box-shadow:var(--shadow);transition:.14s}
[data-theme="dark"] .chip{background:var(--card2)}
.chip:hover{color:var(--blue)}
.chip.on{background:var(--blue);color:#fff;font-weight:600}
.finput{width:100%;padding:9px 13px;border:none;border-radius:10px;background:var(--card);color:var(--label);
  font-family:inherit;font-size:14.5px;box-shadow:var(--shadow);outline:none}
[data-theme="dark"] .finput{background:var(--card2)}
.finput:focus{box-shadow:0 0 0 3px rgba(0,122,255,.25)}
.fnote{padding:8px 18px 20px;font-size:12.5px;color:var(--label2);line-height:1.45}

/* ══════════════ CARDS ══════════════ */
.grid{display:grid;gap:14px;grid-template-columns:repeat(12,1fr);align-items:stretch}
.vc{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;min-width:0}
.vc-h{padding:15px 18px 4px}
.vc-h .t{font-size:16px;font-weight:650;letter-spacing:-.018em}
.vc-b{padding:6px 18px 16px;flex:1;min-width:0;min-height:0;overflow:hidden;display:flex;flex-direction:column}
.vc-b.pad{padding:6px 0 6px}
.ch{flex:1 1 auto;min-height:0}
.span2{grid-column:span 2}.span3{grid-column:span 3}.span4{grid-column:span 4}
.span5{grid-column:span 5}.span6{grid-column:span 6}.span7{grid-column:span 7}
.span8{grid-column:span 8}.span9{grid-column:span 9}.span12{grid-column:span 12}
@media(max-width:1250px){.span3,.span4{grid-column:span 6}.span5,.span7,.span8,.span9{grid-column:span 12}}
@media(max-width:860px){.span2,.span3,.span4,.span6{grid-column:span 12}}

/* ── KPI tile ── */
.kpi{padding:15px 18px 16px;display:flex;flex-direction:column;gap:2px;min-height:104px}
.kpi .kl{font-size:13px;color:var(--label2);font-weight:500}
.kpi .kv{font-size:32px;font-weight:700;letter-spacing:-.03em;line-height:1.1;margin-top:2px}
.kpi .kv small{font-size:16px;font-weight:600;color:var(--label2);letter-spacing:-.01em}
.kpi .ks{font-size:12.5px;color:var(--label3);margin-top:3px}
.kpi .kbar{height:5px;border-radius:980px;background:var(--fill);overflow:hidden;margin-top:auto}
.kpi .kbar i{display:block;height:100%;border-radius:980px}

/* ── Gauge grid ── */
.gauges{display:grid;grid-template-columns:repeat(auto-fit,minmax(124px,1fr));gap:6px}
.gauge{text-align:center;padding:6px 4px 10px}
.gauge .gl{font-size:12.5px;color:var(--label2);margin-top:6px;line-height:1.3}
.gauge .gs{font-size:11.5px;color:var(--label3);margin-top:1px}

.tag{display:inline-flex;align-items:center;font-size:12px;font-weight:600;padding:3px 9px;border-radius:980px;white-space:nowrap}
.t-ok{background:var(--okbg);color:var(--oktx)}
.t-warn{background:var(--warnbg);color:var(--warntx)}
.t-bad{background:var(--badbg);color:var(--badtx)}
.t-info{background:var(--infobg);color:var(--infotx)}
.t-mute{background:var(--mutebg);color:var(--label2)}

/* ── Tables (iOS grouped list) ── */
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:12px;font-weight:600;color:var(--label2);padding:8px 18px;
  border-bottom:.5px solid var(--sep);position:sticky;top:0;background:var(--card);z-index:2;white-space:nowrap}
.tbl td{padding:11px 18px;border-bottom:.5px solid var(--sep2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tbody tr:hover{background:var(--fill2)}
.tbl .r{text-align:right}.tbl .c{text-align:center}
/* Bộ lọc cột kiểu Excel */
.thbtn{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border-radius:8px;
  font-size:12px;font-weight:600;color:var(--label2);background:transparent;white-space:nowrap;max-width:220px}
.thbtn:hover{background:var(--fill)}
.thbtn.on{background:var(--infobg);color:var(--blue)}
.thbtn i{font-style:normal;font-size:9px;opacity:.75}
.fpop{position:fixed;z-index:850;width:290px;background:var(--card);border-radius:14px;
  box-shadow:0 16px 50px rgba(0,0,0,.24);display:none;flex-direction:column;overflow:hidden}
.fpop.on{display:flex}
.fpop-s{padding:12px 12px 8px}
.fpop-s input{width:100%;padding:9px 12px;border:none;border-radius:10px;background:var(--fill);
  color:var(--label);font-family:inherit;font-size:14px;outline:none}
.fpop-s input:focus{box-shadow:0 0 0 2.5px rgba(0,122,255,.28)}
.fpop-a{display:flex;gap:8px;padding:0 12px 10px;border-bottom:.5px solid var(--sep)}
.fpop-a button{padding:7px 14px;border-radius:980px;background:var(--fill);color:var(--blue);font-size:13.5px;font-weight:500}
.fpop-a button:hover{background:var(--fill2)}
.fpop-l{overflow-y:auto;max-height:262px;padding:6px 0}
.fpop-i{display:flex;align-items:center;gap:11px;padding:8px 14px;cursor:pointer;font-size:14.5px}
.fpop-i:hover{background:var(--fill2)}
.fpop-i .cb{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--label3);flex-shrink:0;
  display:grid;place-items:center;color:#fff;font-size:14px;line-height:1}
.fpop-i.sel .cb{background:var(--blue);border-color:var(--blue)}
.fpop-i span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fpop-i b{color:var(--label3);font-weight:400;font-size:13px}
.fpop-f{display:flex;justify-content:space-between;gap:10px;padding:11px 12px;border-top:.5px solid var(--sep)}
.fpop-f button{padding:9px 18px;border-radius:980px;font-size:14px;font-weight:600}
.fpop-f .c{background:var(--fill);color:var(--label2)}
.fpop-f .a{background:var(--blue);color:#fff}

/* Tiêu đề cột = bộ lọc (có mũi tên) */
.tbl th.fh{padding:6px 10px 8px}
.thf{width:100%;min-width:78px;max-width:230px;padding:6px 22px 6px 9px;border:none;border-radius:8px;
  background:var(--fill);color:var(--label2);font-family:inherit;font-size:12px;font-weight:600;
  outline:none;cursor:pointer;-webkit-appearance:none;appearance:none;white-space:nowrap;
  text-overflow:ellipsis;
  background-image:linear-gradient(45deg,transparent 50%,var(--label2) 50%),linear-gradient(135deg,var(--label2) 50%,transparent 50%);
  background-position:calc(100% - 12px) 53%,calc(100% - 8px) 53%;background-size:4px 4px,4px 4px;background-repeat:no-repeat}
.thf.on{background-color:var(--infobg);color:var(--blue)}
.thf:focus{box-shadow:0 0 0 2.5px rgba(0,122,255,.28)}
.tbl tr.clk{cursor:pointer}
.tbl tr.clk:hover{background:var(--infobg)}
.lnk{color:var(--blue);text-decoration:none;font-weight:500}
.lnk:hover{text-decoration:underline}

/* Trục tháng cho lịch mốc */
.gt-axis{display:grid;grid-template-columns:196px 1fr;gap:10px;margin-bottom:6px}
.gt-scale{display:flex;background:var(--fill2);border-radius:8px;overflow:hidden;height:26px}
.gt-scale div{flex-shrink:0;border-right:1px solid var(--sep);font-size:11.5px;color:var(--label2);
  display:flex;align-items:center;justify-content:center;white-space:nowrap;overflow:hidden}
.gt-scale div:last-child{border-right:none}
.gt .track .today{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--red);border-radius:2px;z-index:3}

/* Modal chi tiết kiểu iOS */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:800;opacity:0;visibility:hidden;transition:.22s}
.mask.on{opacity:1;visibility:visible}
.msheet{position:fixed;top:50%;left:50%;width:min(880px,94vw);max-height:88vh;background:var(--bg);z-index:801;
  border-radius:20px;overflow:hidden;
  transform:translate(-50%,-50%) scale(.94);opacity:0;visibility:hidden;
  transition:transform .26s cubic-bezier(.32,.72,.35,1),opacity .2s,visibility .2s;
  display:flex;flex-direction:column;box-shadow:0 24px 70px rgba(0,0,0,.32)}
.msheet.on{transform:translate(-50%,-50%) scale(1);opacity:1;visibility:visible}
.msheet .mh{padding:18px 20px 12px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;
  border-bottom:.5px solid var(--sep)}
.msheet .mh > div:first-child{flex:1 1 auto;min-width:0}
.msheet .mh .tbtn{flex:0 0 auto}
.msheet .mh b{font-size:20px;font-weight:700;letter-spacing:-.022em}
.msheet .mh span{display:block;font-size:13px;color:var(--label2);margin-top:2px;font-weight:400}
.msheet .mb{overflow-y:auto;padding:14px 20px 22px}
.mrow{display:flex;justify-content:space-between;gap:14px;padding:11px 0;border-bottom:.5px solid var(--sep2);font-size:14.5px}
.mrow:last-child{border-bottom:none}
.mrow span{color:var(--label2);flex-shrink:0}
.mrow b{text-align:right;font-weight:600;word-break:break-word}
.mgroup{background:var(--card);border-radius:14px;padding:4px 16px;margin-bottom:14px}
.mtitle{font-size:12.5px;font-weight:600;color:var(--label2);margin:16px 4px 7px}

/* Bộ lọc theo cột trong bảng */
.tbl tr.frow th{padding:6px 18px 10px;background:var(--card);top:35px;border-bottom:.5px solid var(--sep)}
.tf{width:100%;min-width:64px;padding:6px 9px;border:none;border-radius:8px;background:var(--fill);
  color:var(--label);font-family:inherit;font-size:12.5px;outline:none;font-weight:400}
.tf:focus{box-shadow:0 0 0 2.5px rgba(0,122,255,.28)}
select.tf{cursor:pointer;-webkit-appearance:none;appearance:none;padding-right:20px;
  background-image:linear-gradient(45deg,transparent 50%,var(--label3) 50%),linear-gradient(135deg,var(--label3) 50%,transparent 50%);
  background-position:calc(100% - 12px) 52%,calc(100% - 8px) 52%;background-size:4px 4px,4px 4px;background-repeat:no-repeat}
.seg{display:inline-flex;background:var(--fill);border-radius:9px;padding:2px;gap:2px}
.seg button{padding:6px 14px;border-radius:7px;font-size:13.5px;color:var(--label);white-space:nowrap}
.seg button.on{background:var(--card);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.1)}
[data-theme="dark"] .seg button.on{background:var(--gray)}
.scroll{overflow:auto;flex:1 1 auto;min-height:0;max-height:420px}
.scroll.tall{max-height:620px}
.dbar{min-width:72px;max-width:130px}
.dbar b{display:block;font-size:13px;font-weight:600;line-height:1.25;font-variant-numeric:tabular-nums}
.dbar .trk{height:4px;border-radius:980px;background:var(--fill);overflow:hidden;margin-top:4px}
.dbar .trk i{display:block;height:100%;border-radius:980px}

.legend{display:flex;flex-wrap:wrap;gap:8px 16px;padding:2px 0 8px;font-size:13px;color:var(--label2)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:3px;display:block}

.empty{padding:34px 20px;text-align:center;color:var(--label2);font-size:14px}
/* Khu vực trong trang cuộn liên tục */
.sec{margin-bottom:34px;scroll-margin-top:16px}
.sec:last-of-type{margin-bottom:10px}
.sec-h{font-size:13px;font-weight:700;color:var(--label3);letter-spacing:.06em;text-transform:uppercase;
  padding:2px 4px 10px}
.copyright{text-align:center;color:var(--label3);font-size:12.5px;padding:20px 0 4px;
  letter-spacing:-.005em}

/* ── Heatmap ── */
.hm{overflow:auto;flex:1 1 auto;min-height:0;max-height:620px}
.hm table{border-collapse:separate;border-spacing:3px;font-size:11px}
.hm th{font-size:11.5px;font-weight:600;color:var(--label2);padding:4px 6px 8px;text-align:center;white-space:nowrap}
.hm th.vil{position:sticky;left:0;background:var(--card);text-align:right;padding-right:8px;z-index:1;color:var(--label);font-weight:600}
.hm table{table-layout:fixed}
.hm td{width:68px;min-width:68px;height:26px;text-align:center;border-radius:7px;color:#fff;font-weight:600;font-size:12px}
.hm th{width:68px;min-width:68px}
.hm th.vil{width:54px;min-width:54px}
.hm thead th{position:sticky;top:0;background:var(--card);z-index:2}
.hm thead th.vil{z-index:3}

/* Lịch mốc giao hàng */
.mstone{margin-bottom:16px}
.mst-h{display:flex;align-items:center;gap:8px;padding:0 4px 8px;font-size:12px;font-weight:700;
  letter-spacing:.02em;color:var(--label2)}
.mst-h i{width:10px;height:10px;border-radius:3px;display:block}
.mst-h b{margin-left:auto;font-weight:500;color:var(--label3);font-size:12px}
.mst-box{background:var(--card);border-radius:14px;overflow:hidden}
.mst{padding:13px 16px;border-bottom:.5px solid var(--sep2);cursor:pointer}
.mst:last-child{border-bottom:none}
.mst:hover{background:var(--fill2)}
.mst-t{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.mst-t span{font-size:14px;font-weight:600;letter-spacing:-.012em;margin-right:auto}
.mst-t .tag{font-size:11.5px;padding:2px 8px}
.mst-d{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--label2);margin-bottom:7px}
.mst-d b{font-weight:600;color:var(--label);font-variant-numeric:tabular-nums}
.mst-d i{font-style:normal;color:var(--label3)}
/* Thanh 2 tầng: tháng/năm ở băng trên, hai thanh kế hoạch ở băng dưới */
.mst-bar{position:relative;height:54px;border-radius:10px;overflow:hidden;display:flex;background:var(--fill2)}
.mst-bar .mo{flex-shrink:0;border-right:1px solid var(--sep);overflow:hidden;white-space:nowrap;
  font-size:11px;font-weight:500;color:var(--label2);display:flex;align-items:flex-start;

.mst-bar .mo:last-child{border-right:none}
.mst-bar .fill{position:absolute;top:24px;height:10px;border-radius:980px;z-index:2;background:var(--blue)}
.mst-bar .fill2{position:absolute;top:38px;height:10px;border-radius:980px;z-index:2;background:var(--orange)}
.mst-bar .dot{position:absolute;top:21px;height:16px;width:8px;border-radius:3px;z-index:3;background:var(--blue)}
.mst-bar .dot2{position:absolute;top:35px;height:16px;width:8px;border-radius:3px;z-index:3;background:var(--orange)}
.mst-bar .cap{position:absolute;top:23px;height:12px;width:5px;border-radius:980px;z-index:3;background:var(--blue);opacity:.7}
.mst-bar .tre{position:absolute;top:37px;font-size:10.5px;font-weight:700;color:var(--warntx);
  line-height:12px;padding-left:12px;z-index:5;white-space:nowrap}
.mst-bar .tre.r{padding-left:0;padding-right:12px}
.mst-bar .tdy{position:absolute;top:2px;bottom:2px;width:2px;background:var(--red);border-radius:2px;z-index:4}
.mst-lg{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--label2);padding:0 2px 12px}
.mst-lg i{display:inline-block;width:16px;height:8px;border-radius:980px;margin-right:6px;vertical-align:middle}
.mst-f{font-size:12px;color:var(--label2);margin-top:7px}
.mst-f b{color:var(--label);font-weight:600}
.mst-f b.warn{color:var(--red)}

/* Bảng có bộ lọc đặt trong modal */
.mtbl{overflow-x:auto;border-radius:12px;background:var(--card);margin-bottom:14px}
.mtbl .tbl{font-size:13px;min-width:640px}
.mtbl .tbl th{padding:7px 12px}
.mtbl .tbl td{padding:9px 12px}

/* ── Timeline ── */
.gt{font-size:13px;flex:1 1 auto}
.gt .row{display:grid;grid-template-columns:196px 1fr;gap:10px;align-items:center;padding:6px 0;border-bottom:.5px solid var(--sep2)}
.gt .row:last-child{border-bottom:none}
.gt .lb{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;font-size:13.5px}
.gt .lb span{display:block;font-weight:400;color:var(--label2);font-size:11.5px}
.gt .track{position:relative;height:24px;background:var(--fill);border-radius:980px;overflow:hidden}
.gt .bar{position:absolute;top:0;bottom:0;border-radius:980px;display:flex;align-items:center;
  padding:0 9px;color:#fff;font-size:11.5px;font-weight:600;overflow:hidden;white-space:nowrap}

.tip{position:fixed;z-index:999;background:rgba(28,28,30,.94);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);

  box-shadow:0 8px 30px rgba(0,0,0,.28);max-width:300px;line-height:1.45;opacity:0;transition:opacity .12s}
.tip.on{opacity:1}
.tip .tr{display:flex;justify-content:space-between;gap:16px;margin-top:2px;color:rgba(235,235,245,.7)}
.tip .tr span{color:#fff;font-weight:600}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(160%);z-index:900;
  opacity:0;visibility:hidden;pointer-events:none;
  background:rgba(28,28,30,.94);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);color:#fff;font-size:14px;
  padding:12px 20px;border-radius:980px;box-shadow:0 8px 30px rgba(0,0,0,.3);
  transition:transform .34s cubic-bezier(.32,.72,.35,1),opacity .2s,visibility .2s;max-width:80vw;text-align:center}
.toast.on{transform:translateX(-50%) translateY(0);opacity:1;visibility:visible}
.toast.err{background:rgba(255,59,48,.95)}

svg text{font-family:inherit}
.axis{font-size:11.5px;fill:var(--label2)}
.gl2{stroke:var(--sep2);stroke-width:1}
.bar-i{transition:opacity .12s}
.bar-i:hover{opacity:.75;cursor:pointer}

      s += '<rect x="' + ml + '" y="' + y + '" width="' + iw + '" height="' + bh + '" rx="2" fill="var(--fill)"/>';
      s += '<rect class="bar-i" x="' + ml + '" y="' + y + '" width="' + Math.max(1,bw).toFixed(1) + '" height="' + bh + '" rx="2" fill="'
         + (it.c || 'var(--c1)') + '"' + tipAttr('<b>' + esc(it.k) + '</b><div class="tr">' + esc(o.unit||'Giá trị') + '<span>' + vf(it.v) + '</span></div>' + (it.sub ? '<div class="tr">' + esc(it.sub) + '</div>' : ''))
         + (o.onClick ? clickAttr(o.onClick.replace('$L', "'" + String(it.k).replace(/'/g,"\\'") + "'")) : '') + '/>';
      s += '<text class="axis" x="' + (ml+iw+6) + '" y="' + (y+bh/2+3.5) + '" fill="var(--label2)">' + vf(it.v)
         + (it.u ? '<tspan fill="var(--label3)"> ' + esc(it.u) + '</tspan>' : '')
         + (it.box ? '<tspan fill="var(--label3)"> (' + esc(it.box) + ')</tspan>' : '') + '</text>';
    });
    return s + '</svg>';
  }}, o.h || Math.min(520, 18 + (o.items.length||1) * (o.rh || 24)));
}

/* ── Đường / vùng ───────────────────────────────────────────── */
function lineChart(o){
  const labels = o.labels, series = o.series, vf = o.vf || (v => fmt(v));
  return chart({ draw(W, H){
    const ml = o.ml != null ? o.ml : 46, mr = 12, mt = 12, mb = 30;
    const iw = Math.max(30, W-ml-mr), ih = Math.max(30, H-mt-mb);
    let max = 0; series.forEach(se => se.data.forEach(v => { if (v != null) max = Math.max(max, +v||0); }));
    max = niceMax(max || 1);
    const n = labels.length, step = n > 1 ? iw/(n-1) : 0;
    const X = i => ml + step*i, Y = v => mt + ih - ih*(+v||0)/max;
    let s = '<svg width="100%" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '">';
    for (let g = 0; g <= 4; g++){ const y = mt+ih-ih*g/4;
      s += '<line class="gl2" x1="' + ml + '" y1="' + y + '" x2="' + (ml+iw) + '" y2="' + y + '"/>';
      s += '<text class="axis" x="' + (ml-6) + '" y="' + (y+3) + '" text-anchor="end">' + vf(max*g/4) + '</text>'; }
    series.forEach(se => {
      const pts = se.data.map((v,i) => v == null ? null : [X(i), Y(v)]).filter(Boolean);
      if (!pts.length) return;
      const d = pts.map((p,i) => (i?'L':'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
      if (se.area) s += '<path d="' + d + ' L' + pts[pts.length-1][0].toFixed(1) + ' ' + (mt+ih) + ' L' + pts[0][0].toFixed(1) + ' ' + (mt+ih) + ' Z" fill="' + se.color + '" opacity=".13"/>';
      s += '<path d="' + d + '" fill="none" stroke="' + se.color + '" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"'
         + (se.dash ? ' stroke-dasharray="5 4"' : '') + '/>';
      se.data.forEach((v,i) => { if (v == null) return;
        s += '<circle class="bar-i" cx="' + X(i).toFixed(1) + '" cy="' + Y(v).toFixed(1) + '" r="3.4" fill="var(--card)" stroke="' + se.color + '" stroke-width="2"'
           + tipAttr('<b>' + esc(labels[i]) + '</b><div class="tr">' + esc(se.name) + '<span>' + vf(v) + '</span></div>') + '/>'; });
    });
    labels.forEach((lb,i) => { if (n > 14 && i % Math.ceil(n/12)) return;
      s += '<text class="axis" x="' + X(i).toFixed(1) + '" y="' + (mt+ih+14) + '" text-anchor="middle">' + esc(lb) + '</text>'; });
    return s + '</svg>';
  }}, o.h || 220);
}

/* ── Kết hợp cột + đường ────────────────────────────────────── */
function comboChart(o){
  const labels = o.labels, bars = o.bars, lines = o.lines || [];
  const vf = o.vf || (v => fmt(v)), vf2 = o.vf2 || vf;
  return chart({ draw(W, H){
    const ml = 46, mr = 42, mt = 12, mb = 30;
    const iw = Math.max(30, W-ml-mr), ih = Math.max(30, H-mt-mb);
    let maxB = 0; bars.forEach(se => se.data.forEach(v => maxB = Math.max(maxB, +v||0)));
    let maxL = 0; lines.forEach(se => se.data.forEach(v => { if (v != null) maxL = Math.max(maxL, +v||0); }));
    maxB = niceMax(maxB||1); maxL = niceMax(maxL||1);
    const n = labels.length, gw = iw/Math.max(1,n), pad = Math.min(10, gw*.2);
    const bw = (gw - pad*2)/Math.max(1,bars.length);
    let s = '<svg width="100%" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '">';
    for (let g = 0; g <= 4; g++){ const y = mt+ih-ih*g/4;
      s += '<line class="gl2" x1="' + ml + '" y1="' + y + '" x2="' + (ml+iw) + '" y2="' + y + '"/>';
      s += '<text class="axis" x="' + (ml-6) + '" y="' + (y+3) + '" text-anchor="end">' + vf(maxB*g/4) + '</text>';
      s += '<text class="axis" x="' + (ml+iw+6) + '" y="' + (y+3) + '">' + vf2(maxL*g/4) + '</text>'; }
    labels.forEach((lb,i) => {
      const x0 = ml + gw*i + pad;
      bars.forEach((se,k) => { const v = +se.data[i]||0; if (!v) return;
        const bh = Math.max(1, ih*v/maxB);
        s += '<rect class="bar-i" x="' + (x0+bw*k).toFixed(1) + '" y="' + (mt+ih-bh).toFixed(1) + '" width="' + Math.max(1,bw-2).toFixed(1)
           + '" height="' + bh.toFixed(1) + '" rx="2" fill="' + se.color + '"'
           + tipAttr('<b>' + esc(lb) + '</b><div class="tr">' + esc(se.name) + '<span>' + vf(v) + '</span></div>') + '/>'; });
      s += '<text class="axis" x="' + (ml+gw*i+gw/2).toFixed(1) + '" y="' + (mt+ih+14) + '" text-anchor="middle">' + esc(lb) + '</text>';
    });
    lines.forEach(se => {
      const pts = se.data.map((v,i) => v == null ? null : [ml+gw*i+gw/2, mt+ih-ih*(+v||0)/maxL]).filter(Boolean);
      if (!pts.length) return;
      s += '<path d="' + pts.map((p,i) => (i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ') + '" fill="none" stroke="' + se.color + '" stroke-width="2.4" stroke-linecap="round"/>';
      se.data.forEach((v,i) => { if (v == null) return;
        s += '<circle class="bar-i" cx="' + (ml+gw*i+gw/2).toFixed(1) + '" cy="' + (mt+ih-ih*(+v||0)/maxL).toFixed(1) + '" r="3.6" fill="var(--card)" stroke="' + se.color + '" stroke-width="2"'
           + tipAttr('<b>' + esc(labels[i]) + '</b><div class="tr">' + esc(se.name) + '<span>' + vf2(v) + '</span></div>') + '/>'; });
    });
    return s + '</svg>';
  }}, o.h || 240);
}

/* ── Vành khuyên ────────────────────────────────────────────── */
function donutChart(o){
  const items = (o.items||[]).filter(x => (+x.v||0) > 0);
  const tot = items.reduce((s,x) => s + (+x.v||0), 0);
  const vf = o.vf || (v => fmt(v));
  return chart({ draw(W, H){
    const R = Math.min(W*.42, H*.44), r = R*.62, cx = W*.30 < R+8 ? R+8 : W*.30, cy = H/2;
    let a0 = -Math.PI/2, s = '<svg width="100%" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '">';
    if (!tot) return s + '<text class="axis" x="' + (W/2) + '" y="' + (H/2) + '" text-anchor="middle">Không có dữ liệu</text></svg>';
    items.forEach(it => {
      const a = (+it.v||0)/tot*Math.PI*2, a1 = a0+a, big = a > Math.PI ? 1 : 0;
      const p = (rr,ang) => [(cx+rr*Math.cos(ang)).toFixed(2), (cy+rr*Math.sin(ang)).toFixed(2)];
      const A = p(R,a0), B = p(R,a1), C = p(r,a1), D = p(r,a0);
      s += '<path class="bar-i" d="M' + A + ' A' + R + ' ' + R + ' 0 ' + big + ' 1 ' + B + ' L' + C + ' A' + r + ' ' + r + ' 0 ' + big + ' 0 ' + D + ' Z" fill="' + it.c + '"'
         + tipAttr('<b>' + esc(it.k) + '</b><div class="tr">' + vf(it.v) + '<span>' + pct(it.v,tot) + '%</span></div>')
         + (o.onClick ? clickAttr(o.onClick.replace('$L', "'" + String(it.k).replace(/'/g,"\\'") + "'")) : '') + '/>';
      a0 = a1;
    });
    s += '<text x="' + cx + '" y="' + (cy-2) + '" text-anchor="middle" style="font-size:19px;font-weight:700;fill:var(--label)">' + (o.center != null ? o.center : fmt(tot)) + '</text>';
    if (o.centerSub) s += '<text x="' + cx + '" y="' + (cy+14) + '" text-anchor="middle" class="axis">' + esc(o.centerSub) + '</text>';
    const lx = cx + R + 18; let ly = cy - (items.length*17)/2 + 8;
    items.forEach(it => {
      if (lx + 40 > W) return;
      s += '<rect x="' + lx + '" y="' + (ly-8) + '" width="9" height="9" rx="2" fill="' + it.c + '"/>';
      const nm = String(it.k).length > 18 ? String(it.k).slice(0,17)+'…' : it.k;
      s += '<text class="axis" x="' + (lx+14) + '" y="' + ly + '" fill="var(--label2)">' + esc(nm) + '</text>';
      s += '<text class="axis" x="' + (W-4) + '" y="' + ly + '" text-anchor="end" fill="var(--label3)">' + vf(it.v) + '</text>';
      ly += 17;
    });
    return s + '</svg>';
  }}, o.h || 210);
}

/* ── Phân tán ───────────────────────────────────────────────── */
function scatterChart(o){
  const pts = o.points, vf = o.vf || (v => fmt(v) + '%');
  return chart({ draw(W, H){
    const ml = 40, mr = 12, mt = 12, mb = 32;
    const iw = Math.max(30,W-ml-mr), ih = Math.max(30,H-mt-mb);
    const mx = o.maxX || 100, my = o.maxY || 100;
    let s = '<svg width="100%" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '">';
    for (let g = 0; g <= 4; g++){
      const y = mt+ih-ih*g/4, x = ml+iw*g/4;
      s += '<line class="gl2" x1="' + ml + '" y1="' + y + '" x2="' + (ml+iw) + '" y2="' + y + '"/>';
      s += '<line class="gl2" x1="' + x + '" y1="' + mt + '" x2="' + x + '" y2="' + (mt+ih) + '"/>';
      s += '<text class="axis" x="' + (ml-6) + '" y="' + (y+3) + '" text-anchor="end">' + Math.round(my*g/4) + '</text>';
      s += '<text class="axis" x="' + x + '" y="' + (mt+ih+14) + '" text-anchor="middle">' + Math.round(mx*g/4) + '</text>';
    }
    pts.forEach(p => {
      const x = ml + iw*Math.min(p.x,mx)/mx, y = mt + ih - ih*Math.min(p.y,my)/my;
      s += '<circle class="bar-i" cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="' + (p.r||4.5) + '" fill="' + (p.c||'var(--c1)') + '" fill-opacity=".78" stroke="' + (p.c||'var(--c1)') + '" stroke-width="1"'
         + tipAttr('<b>' + esc(p.k) + '</b><div class="tr">' + esc(o.xl) + '<span>' + vf(p.x) + '</span></div><div class="tr">' + esc(o.yl) + '<span>' + vf(p.y) + '</span></div>') + '/>';
    });
    s += '<text class="axis" x="' + (ml+iw/2) + '" y="' + (H-2) + '" text-anchor="middle">' + esc(o.xl) + '</text>';
    return s + '</svg>';
  }}, o.h || 250);
}

/* ── Phễu ───────────────────────────────────────────────────── */
function funnelChart(o){
  const st = o.steps, vf = o.vf || (v => fmt(v));
  return chart({ draw(W, H){
    const n = st.length, base = st[0] ? (+st[0].v||1) : 1;
    const rh = Math.min(46, (H-6)/n);
    const lw = Math.min(W*.42, Math.max(96, Math.max.apply(null, st.map(x => String(x.k).length)) * 6.3 + 12));
    let s = '<svg width="100%" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '">';
    st.forEach((x,i) => {
      const y = i*rh, w = Math.max(3, (W-lw-56) * (+x.v||0)/base), bh = rh-9;
      s += '<text class="axis" x="' + (lw-8) + '" y="' + (y+bh/2+4) + '" text-anchor="end" fill="var(--label2)" style="font-size:11px">' + esc(x.k) + '</text>';
      s += '<rect class="bar-i" x="' + lw + '" y="' + y + '" width="' + w.toFixed(1) + '" height="' + bh + '" rx="3" fill="' + (x.c||HEX[i%9]) + '"'
         + tipAttr('<b>' + esc(x.k) + '</b><div class="tr">' + vf(x.v) + '<span>' + pct(x.v, base) + '% của đầu vào</span></div>') + '/>';
      s += '<text x="' + (lw+w+7) + '" y="' + (y+bh/2+4) + '" class="axis" fill="var(--label)" style="font-weight:600;font-size:11.5px">' + vf(x.v)
         + '<tspan fill="var(--label3)" style="font-weight:400"> · ' + pct(x.v, base) + '%</tspan></text>';
    });
    return s + '</svg>';
  }}, o.h || (st.length * 46 + 6));
}

/* ── Tooltip toàn cục ───────────────────────────────────────── */
document.addEventListener('mouseover', e => {
  const t = e.target.closest('[data-tip]'); if (!t) return;
  const tip = $('tip'); tip.innerHTML = t.dataset.tip; tip.classList.add('on');
});
document.addEventListener('mousemove', e => {
  const tip = $('tip'); if (!tip.classList.contains('on')) return;
  const x = Math.min(e.clientX + 14, window.innerWidth - tip.offsetWidth - 10);
  const y = Math.min(e.clientY + 16, window.innerHeight - tip.offsetHeight - 10);
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
});
document.addEventListener('mouseout', e => { if (e.target.closest('[data-tip]')) $('tip').classList.remove('on'); });

/* ── Khối giao diện dùng lại ────────────────────────────────── */
function card(o){
  return '<div class="vc ' + (o.span != null ? o.span : 'span6') + '">'
    + '<div class="vc-h"><div class="t">' + o.title + '</div></div>'
    + '<div class="vc-b' + (o.flush ? ' pad' : '') + '">' + o.body + '</div></div>';
}
function kpi(o){
  return '<div class="vc ' + (o.span || 'span2') + '"' + (o.go ? ' style="cursor:pointer" onclick="' + o.go + '"' : '') + '><div class="kpi">'
    + '<div class="kl">' + o.label + '</div>'
    + '<div class="kv num" style="' + (o.color ? 'color:' + o.color + ';' : '')
      + (String(o.value).length > 9 ? 'font-size:20px' : String(o.value).length > 6 ? 'font-size:23px' : '') + '">' + o.value + (o.unit ? '<small> ' + o.unit + '</small>' : '') + '</div>'
    + (o.sub ? '<div class="ks">' + o.sub + '</div>' : '')
    + (o.bar != null ? '<div class="kbar"><i style="width:' + Math.min(100, Math.max(0,o.bar)) + '%;background:' + (o.color || 'var(--blue)') + '"></i></div>' : '')
    + '</div></div>';
}
function legend(items){
  return '<div class="legend">' + items.map(x => '<span><i style="background:' + x.c + '"></i>' + esc(x.k) + '</span>').join('') + '</div>';
}
function dataBar(v, max, color, label){
  const w = max ? Math.min(100, Math.abs(v)/max*100) : 0, c = color || 'var(--blue)';
  return '<div class="dbar"><b style="color:' + c + '">' + (label != null ? label : fmt(v)) + '</b>'
    + '<div class="trk"><i style="width:' + w.toFixed(1) + '%;background:' + c + '"></i></div></div>';
}
function statTag(t, cls){ return '<span class="tag t-' + cls + '">' + esc(t) + '</span>'; }


/* ── Vòng tiến độ (Activity ring) ── */
function ring(o){
  const R = o.r || 44, w = o.w || 9, C = 2*Math.PI*(R-w/2);
  const v = Math.max(0, Math.min(100, +o.pct || 0));
  const D = R*2;
  return '<svg width="' + D + '" height="' + D + '" viewBox="0 0 ' + D + ' ' + D + '"' + tipAttr(o.tip || '') + '>'
    + '<circle cx="' + R + '" cy="' + R + '" r="' + (R-w/2) + '" fill="none" stroke="var(--fill)" stroke-width="' + w + '"/>'
    + '<circle cx="' + R + '" cy="' + R + '" r="' + (R-w/2) + '" fill="none" stroke="' + o.color + '" stroke-width="' + w
    + '" stroke-linecap="round" stroke-dasharray="' + (C*v/100).toFixed(2) + ' ' + C.toFixed(2)
    + '" transform="rotate(-90 ' + R + ' ' + R + ')"/>'
    + '<text x="' + R + '" y="' + (R + 1) + '" text-anchor="middle" dominant-baseline="middle" '
    + 'style="font-size:' + (o.fs || 17) + 'px;font-weight:700;letter-spacing:-.02em;fill:var(--label)">' + o.text + '</text>'
    + '</svg>';
}
function gaugeGrid(items){
  return '<div class="gauges">' + items.map(x =>
    '<div class="gauge"' + (x.go ? ' style="cursor:pointer" onclick="' + x.go + '"' : '') + '>'
    + ring({pct:x.pct, color:x.c, text:x.txt,
        tip:'<b>' + esc(x.k) + '</b><div class="tr">' + esc(x.tipL || 'Tỷ lệ') + '<span>' + esc(x.txt) + '</span></div>'
            + (x.s ? '<div class="tr">' + esc(x.s) + '</div>' : '')})
    + '<div class="gl">' + esc(x.k) + '</div>' + (x.s ? '<div class="gs">' + esc(x.s) + '</div>' : '') + '</div>').join('') + '</div>';
}


/* ══════════════════════════════════════════════════════════════
   BẢNG CÓ BỘ LỌC NGAY TRÊN TIÊU ĐỀ CỘT  +  MODAL CHI TIẾT
   ══════════════════════════════════════════════════════════════ */
const TBL = {};        // trạng thái lọc của từng bảng

/* cfg = {id, cols:[{k,lb,cls,get,cell,filter,width}], rows:fn, limit, onRow} */
function ftable(cfg){
  TBL[cfg.id] = TBL[cfg.id] || {cfg, f:{}};
  TBL[cfg.id].cfg = cfg;
  return '<div id="' + cfg.id + '">' + ftableInner(cfg.id) + '</div>';
}
const valOf = (c, x) => { const v = c.get(x); return v == null || v === '' ? '(trống)' : String(v); };

/* Lọc theo tập giá trị đã chọn của từng cột */
function ftFilter(id, rows, skipKey){
  const T = TBL[id];
  T.cfg.cols.forEach(c => {
    if (c.k === skipKey) return;
    const sel = T.f[c.k];
    if (sel && sel.length) rows = rows.filter(x => sel.indexOf(valOf(c, x)) >= 0);
  });
  return rows;
}
function ftRows(id){ const T = TBL[id]; return T ? ftFilter(id, T.cfg.rows()) : []; }

function ftableInner(id){
  const T = TBL[id]; if (!T) return '';
  const cfg = T.cfg, R = ftRows(id), lim = cfg.limit || 300;
  let h = '<table class="tbl"><thead><tr>';
  cfg.cols.forEach(c => {
    if (c.filter === false){ h += '<th class="fh ' + (c.cls||'') + '">' + esc(c.lb) + '</th>'; return; }
    const on = (T.f[c.k] || []).length > 0;
    h += '<th class="fh ' + (c.cls||'') + '"><button class="thbtn' + (on ? ' on' : '')
      + '" onclick="openFilter(event,\'' + id + '\',\'' + c.k + '\')">' + esc(c.lb) + '<i>▼</i></button></th>';
  });
  h += '</tr></thead><tbody>';
  if (!R.length) h += '<tr><td colspan="' + cfg.cols.length + '"><div class="empty">Không có dòng nào khớp bộ lọc</div></td></tr>';
  R.slice(0, lim).forEach((x, i) => {
    const cl = cfg.onRow ? ' class="clk" onclick="' + cfg.onRow(x, i) + '"' : '';
    h += '<tr' + cl + '>' + cfg.cols.map(c => '<td' + (c.cls ? ' class="' + c.cls + '"' : '') + '>' + (c.cell ? c.cell(x) : esc(c.get(x))) + '</td>').join('') + '</tr>';
  });
  if (R.length > lim) h += '<tr><td colspan="' + cfg.cols.length + '" style="color:var(--label2);font-size:13px">Hiển thị ' + lim + ' / ' + fmt(R.length) + ' dòng</td></tr>';
  return h + '</tbody></table>';
}
function ftRefresh(id){
  const el = $(id); if (el) el.innerHTML = ftableInner(id);
  const c = $(id + '_count'); if (c) c.textContent = fmt(ftRows(id).length) + ' dòng';
}
function clearFT(id){ if (TBL[id]){ TBL[id].f = {}; ftRefresh(id); } }

/* ── Popup lọc kiểu Excel ── */
let FPOP = null;
function openFilter(ev, id, key){
  ev.stopPropagation();
  const T = TBL[id]; if (!T) return;
  const c = T.cfg.cols.find(x => x.k === key); if (!c) return;
  const base = ftFilter(id, T.cfg.rows(), key);
  const cnt = {};
  base.forEach(x => { const v = valOf(c, x); cnt[v] = (cnt[v] || 0) + 1; });
  const all = Object.keys(cnt).sort((a,b) => (isFinite(+a) && isFinite(+b)) ? (+b - +a) : a.localeCompare(b, 'vi'));
  const cur = T.f[key];
  FPOP = {id, key, all, cnt, sel: cur && cur.length ? cur.slice() : all.slice(), q:''};
  drawFilter();
  const p = $('fpop'), r = ev.currentTarget.getBoundingClientRect();
  p.classList.add('on');
  const w = p.offsetWidth || 290, hgt = p.offsetHeight || 380;
  p.style.left = Math.max(8, Math.min(r.left, window.innerWidth - w - 8)) + 'px';
  p.style.top  = Math.max(8, Math.min(r.bottom + 6, window.innerHeight - hgt - 8)) + 'px';
}
function drawFilter(){
  if (!FPOP) return;
  const q = FPOP.q.toLowerCase();
  const list = FPOP.all.filter(v => !q || v.toLowerCase().indexOf(q) >= 0);
  $('fpop').innerHTML =
      '<div class="fpop-s"><input id="fpopQ" placeholder="Tìm giá trị…" value="' + esc(FPOP.q)
    + '" oninput="FPOP.q=this.value;drawFilter();$(\'fpopQ\').focus()"></div>'
    + '<div class="fpop-a"><button onclick="event.stopPropagation();fpopAll(1)">Chọn tất cả</button>'
    + '<button onclick="event.stopPropagation();fpopAll(0)">Bỏ chọn</button></div>'

function fpopTog(v){

function fpopAll(on){
  const q = FPOP.q.toLowerCase();
  const list = FPOP.all.filter(v => !q || v.toLowerCase().indexOf(q) >= 0);
  if (on) list.forEach(v => { if (FPOP.sel.indexOf(v) < 0) FPOP.sel.push(v); });
  else FPOP.sel = FPOP.sel.filter(v => list.indexOf(v) < 0);
  drawFilter();
}
function fpopApply(){
  const T = TBL[FPOP.id];
  T.f[FPOP.key] = (FPOP.sel.length === FPOP.all.length) ? null : FPOP.sel.slice();
  ftRefresh(FPOP.id); closeFilter();
}
function fpopClear(){ const T = TBL[FPOP.id]; T.f[FPOP.key] = null; ftRefresh(FPOP.id); closeFilter(); }

/* Dùng mousedown: lúc này DOM trong popup CHƯA bị vẽ lại nên biết đúng

/* ─────────── PARSER: 3 sheet thanh toán (giữ nguyên quy ước app gốc) ─────────── */
function cfInfo(s){
  s = String(s || '').trim();
  if (!s) return {type:'pending', date:'', label:'Chưa xác nhận'};
  if (/đã\s*tt/i.test(s)) return {type:'paid', date:'', label:'Đã thanh toán'};
  const m = s.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if (m) return {type:'confirmed', date: m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0'), label:'BCH xác nhận '+m[1]+'/'+m[2]};
  return {type:'confirmed', date:'', label:s};
}
const numVN = s => { const v = numI(s); return /\(/.test(String(s||'')) ? -v : v; };
const pctStr = s => { s = String(s||'').trim(); return /%/.test(s) ? s.replace(/\s+/g,'') : ''; };

function parseThauPhu(rows){
  let hi = rows.findIndex(r => /^stt/i.test(String(r[0]||'').trim())); if (hi < 0) hi = 0;
  const hdr = rows[hi] || [];
  const ipcCols = []; let qsCol = -1, hmCol = 2, gtCol = 3, tongCol = 4;
  hdr.forEach((h, idx) => {
    const s = String(h||'').trim(), m = s.match(/^ipc\s*(\d+)/i);
    if (m) ipcCols.push({idx, n:+m[1]});
    else if (/qs/i.test(s)) qsCol = idx;
    else if (/hạng\s*mục/i.test(s)) hmCol = idx;
    else if (/tổng\s*giá\s*trị\s*ipc/i.test(s)) tongCol = idx;
    else if (/giá\s*trị\s*hđ|hđ\s*\/?\s*po/i.test(s)) gtCol = idx;
  });
  if (!ipcCols.length) for (let k = 0; k < 4; k++) ipcCols.push({idx: 6+k*2, n: k+1});
  if (qsCol < 0) qsCol = Math.max.apply(null, ipcCols.map(c => c.idx)) + 2;
  const out = []; let cur = null;
  for (let i = hi+1; i < rows.length; i++){
    const r = rows[i], stt = String(r[0]||'').trim(), name = String(r[1]||'').trim();
    if (!name) continue;
    if (/^\d+$/.test(stt)){ cur = {ten:name, pos:[]}; out.push(cur); continue; }
    if (!cur){ cur = {ten:'Chưa phân nhóm', pos:[]}; out.push(cur); }
    const ipcs = [];
    ipcCols.forEach(c => {
      const val = numI(r[c.idx]), cfRaw = String(r[c.idx+1]||'').trim();
      if (val || cfRaw){ const ci = cfInfo(cfRaw); ipcs.push({n:c.n, val, cf:cfRaw, type:ci.type, date:ci.date, label:ci.label}); }
    });
    cur.pos.push({po:name, hm:String(r[hmCol]||'').trim(), gtHD:numI(r[gtCol]), tongIPC:numI(r[tongCol]), ipcs, qs:String(r[qsCol]||'').trim()});
  }
  return out.filter(c => c.pos.length);
}
const IPC_STEPS = ['Trình PMU','Upload hệ thống','TQT phát hành L1','Nhà thầu trả lời L1','TQT phát hành L2','Chốt giá trị TQT'];
function parseIPC(rows){
  const out = {sum:null, comps:[], ipcs:[]};
  rows.forEach(r => {
    const c1 = String(r[1]||'').trim(); if (!c1) return;
    if (/^ipc\s*\d+/i.test(c1)){
      out.ipcs.push({name:c1.replace(/\s+/g,' ').toUpperCase(), paid:numVN(r[3]), sl:numVN(r[8]), slPct:pctStr(r[11]),
        dntt:numVN(r[12]), dnttPct:pctStr(r[14]),
        steps:[15,16,17,18,19,20].map((ci,k) => ({lb:IPC_STEPS[k], d:String(r[ci]||'').trim()})),
        note:String(r[21]||'').trim()});
    } else if (/^(hợp|hơp)\s*đồng|^plh[đd]/i.test(c1)){
      out.comps.push({name:c1, val:numVN(r[2]), paid:numVN(r[3])});
    } else if (!out.sum && numVN(r[2]) > 1e9){
      out.sum = {duAn:c1, total:numVN(r[2]), paid:numVN(r[3]), paidPct:pctStr(r[4]), remain:numVN(r[5]),
        slDuyet:numVN(r[8]), slPct:pctStr(r[11]), dntt:numVN(r[12]), dnttPct:pctStr(r[14]), slTrinh:numVN(r[10])};
    }
  });
  return (out.sum || out.ipcs.length) ? out : null;
}
function parsePMI(rows){
  const out = [];
  rows.forEach(r => {
    const so = String(r[0]||'').trim(); if (!/pmi\.?\s*\d+\s*$/i.test(so)) return;
    out.push({so, short:'PMI ' + ((so.match(/(\d+)\s*$/)||['','?'])[1]),

/* ─────────── PARSER: các nguồn Google Sheet dự án ─────────── */
function qnum(v){
  let b = String(v == null ? '' : v).trim().replace(/[^\d.,\-]/g, '');
  if (!b || b === '-') return 0;
  const nd = (b.match(/\./g)||[]).length, nc = (b.match(/,/g)||[]).length;
  if (nd && nc) b = b.lastIndexOf(',') > b.lastIndexOf('.') ? b.replace(/\./g,'').replace(',','.') : b.replace(/,/g,'');
  else if (nc)  b = nc > 1 ? b.replace(/,/g,'') : b.replace(',','.');
  else if (nd > 1) b = b.replace(/\./g,'');
  const f = parseFloat(b); return isFinite(f) ? f : 0;
}
function pcnum(v){
  const s = String(v == null ? '' : v).trim(), n = qnum(s);
  if (s.indexOf('%') >= 0) return Math.round(n*10)/10;
  return (n > 0 && n <= 1) ? Math.round(n*1000)/10 : Math.round(n*10)/10;
}
/* Sheet "03.TIẾN ĐỘ 104 CĂN" → danh sách căn */

    out.push({ma:String(x[1]).trim(), khu:String(x[2]||'').trim(), bg:pcnum(x[4]), tc:pcnum(x[6]),
      trades: Array.from({length:9}, (_,k) => pcnum(x[7+k])),
      nt: pcnum(x[17]), ntTrades: Array.from({length:9}, (_,k) => pcnum(x[18+k])),
      note: String(x[16]||'').trim()});
  }
  return out;
}
/* Sheet "9.MA TRẬN XUẤT HÀNG" → danh sách mã sản phẩm (giữ mốc/hạn từ bản chốt) */
function parseFactoryMatrix(rows){
  const meta = {}; DB.factory.prods.forEach(p => meta[p.ma] = p);
  const out = [];
  for (let i = 1; i < rows.length; i++){
    const x = rows[i]; if (!x || x.length < 71 || !String(x[2]||'').trim()) continue;
    const ma = String(x[2]).trim(), m = meta[ma] || {};
    const boq = qnum(x[8]), dat = qnum(x[63]), ra = qnum(x[65]);
    out.push({ma, ten:String(x[3]||'').trim(), hm:String(x[4]||'').trim(), nhom:m.nhom || '',
      mau:String(x[6]||'').replace('MẪU','').trim(), socan:qnum(x[7]), dvt:String(x[5]||'').trim(),
      boq, dat, ra,
      tt: (dat >= boq && dat > 0) ? 'ĐÃ ĐẶT ĐỦ' : (dat > 0 ? 'ĐẶT THIẾU' : 'CHƯA ĐẶT HÀNG'),
      tt_ra: (ra >= boq && ra > 0) ? 'ĐÃ RA ĐỦ' : (ra > 0 ? 'RA MỘT PHẦN' : 'CHƯA RA HÀNG'),

      giao:m.giao || 0, note:String(x[70]||'').trim()});
  }
  return out;
}

/* ─────────── KHO: gộp 2 cách gọi tên nguồn ───────────
   Bảng tồn nền dùng tên "VẬT TƯ PHỤ / CĐT CẤP…", sổ phiếu WMS dùng
   "Vật tư phụ / Vật tư Chủ đầu tư cấp…". Cùng một kho nhưng khác chữ,
   nên phải quy về một tên trước khi cộng.                              */
function noAccent(s){
  return String(s||'').toLowerCase()
    .replace(/[àáạảãâầấậẩẫăằắặẳẵ]/g,'a').replace(/[èéẹẻẽêềếệểễ]/g,'e')
    .replace(/[ìíịỉĩ]/g,'i').replace(/[òóọỏõôồốộổỗơờớợởỡ]/g,'o')
    .replace(/[ùúụủũưừứựửữ]/g,'u').replace(/[ỳýỵỷỹ]/g,'y').replace(/đ/g,'d');
}
function normSrc(s){
  const t = noAccent(s);
  if (t.indexOf('nha may') >= 0) return 'Vật tư nhà máy';
  if (t.indexOf('chinh')   >= 0) return 'Vật tư chính';
  if (t.indexOf('cong cu') >= 0) return 'Công cụ dụng cụ';
  if (t.indexOf('cdt') >= 0 || t.indexOf('chu dau tu') >= 0) return 'Chủ đầu tư cấp';
  if (t.indexOf('phu')     >= 0) return 'Vật tư phụ';
  return String(s||'—');
}
const KHO_SRC = ['Vật tư chính','Vật tư nhà máy','Vật tư phụ','Chủ đầu tư cấp','Công cụ dụng cụ'];

/* Nhập/xuất từng kho: nhập lấy từ bảng tồn nền, xuất lấy từ sổ phiếu;
   nguồn nào có cả hai thì lấy số lớn hơn để không cộng trùng.          */
function wmsBySource(){
  const m = {};
  const get = k => (m[k] = m[k] || {k, invIn:0, invOut:0, logIn:0, logOut:0, ret:0, n:0, stock:0});
  DB.wms.inv.forEach(x => { const o = get(normSrc(x.source));
    o.invIn += (+x.inQty||0); o.invOut += (+x.outQty||0); o.stock += (+x.stock||0); o.n++; });
  (DB.wms.agg||[]).forEach(x => { const o = get(normSrc(x.source));
    o.logIn += (+x.inQty||0); o.logOut += (+x.outQty||0); o.ret += (+x.returnQty||0); });
  return Object.keys(m).map(k => {
    const o = m[k];
    o.nhap = Math.max(o.invIn, o.logIn);
    o.xuat = Math.max(o.invOut, o.logOut);
    o.ton  = Math.max(0, o.nhap - o.xuat);
    return o;
  }).filter(o => o.nhap || o.xuat || o.n).sort((a,b) => (b.nhap + b.xuat) - (a.nhap + a.xuat));
}

/* ─────────── HỒ SƠ ĐỆ TRÌNH: RFA · RFI · Chỉ thị SI · PMI ───────────
   Đọc trực tiếp 4 sheet trên file hồ sơ thanh toán.                    */
const HS_CODE = {A:'Duyệt (A)', AC:'Duyệt kèm ghi chú (AC)', RJ:'Bị từ chối (RJ)',
                C:'Bị từ chối (C)', B:'Duyệt có điều kiện (B)'};
function parseRFA(rows){
  const out = []; let nhom = '';
  rows.forEach((x, i) => {
    if (!x || x.length < 7) return;
    const ref = String(x[1]||'').trim(); if (!ref) return;
    if (i === 0){ const m0 = ref.match(/\(([^)]+)\)\s*$/); if (m0) nhom = m0[1]; return; }
    if (!/\d/.test(ref)){                       // dòng tiêu đề nhóm trong sheet
      const m = ref.match(/\(([^)]+)\)\s*$/);
      nhom = m ? m[1] : ref; return;
    }
    const cd = String(x[6]||'').trim().toUpperCase();
    out.push({loai:'RFA', sheet:'RFA', row:i + 1, nhom, so:ref, mota:String(x[2]||'').trim(),
      nguoi:String(x[3]||'').trim(), ngayTrinh:String(x[4]||'').trim(), ngayTra:String(x[5]||'').trim(),
      code:cd || '—', tt:HS_CODE[cd] || (cd || 'Chờ kết quả'),
      cls:(cd === 'A' || cd === 'AC') ? 'ok' : (cd === 'RJ' || cd === 'C') ? 'bad' : 'warn',
      ghiChu:String(x[8]||'').trim(), file:String(x[10]||'').trim() || String(x[9]||'').trim()});
  });
  return out;
}
function parseRFI(rows){
  const out = [];
  rows.forEach((x, i) => {
    if (i === 0 || !x || x.length < 9) return;
    const so = String(x[1]||'').trim();
    if (!so || /^h[uủ]y$/i.test(so)) return;
    const done = !!String(x[7]||'').trim();
    out.push({loai:'RFI', sheet:'RFI', row:i + 1, so, mota:String(x[2]||'').trim(),
      nguoi:String(x[3]||'').trim(), ngayTrinh:String(x[4]||'').trim(), ngayTra:String(x[5]||'').trim(),
      ngayXL:String(x[6]||'').trim(), code:done ? 'Đã trả lời' : '—',
      tt:done ? 'Đã trả lời' : 'Chờ trả lời', cls:done ? 'ok' : 'warn',
      traLoi:String(x[9]||'').trim(), ghiChu:String(x[10]||'').trim(), file:String(x[11]||'').trim()});
  });
  return out;
}
function parseSI(rows){
  const out = []; let so = '';
  rows.forEach((x, i) => {
    if (i < 4 || !x || x.length < 8) return;
    if (String(x[1]||'').trim()) so = String(x[1]).trim();
    const mota = String(x[2]||'').trim(); if (!mota) return;
    const st = String(x[7]||'').trim(), l = st.toLowerCase();
    out.push({loai:'Chỉ thị SI', sheet:'Chỉ thị SI', row:i + 1, so, mota,
      xuly:String(x[3]||'').trim(), sd:String(x[4]||'').trim(), pmi:String(x[6]||'').trim(),
      nguoi:'', ngayTrinh:'', code:st || '—', tt:st || 'Chưa xử lý',
      cls:l.indexOf('đã trình') >= 0 ? 'ok' : l.indexOf('cancel') >= 0 ? 'mute' : 'warn',
      ghiChu:String(x[3]||'').trim(), file:String(x[4]||'').trim()});
  });
  return out;
}
function pmiHoSo(){
  return (DB.pay.pmi || []).map((p, i) => { const q = pmiState(p);
    return {loai:'PMI', sheet:'PMI', row:i + 2, so:p.so, mota:p.mota, nguoi:'', ngayTrinh:p.ngayNop,
      ngayTra:'', code:p.tt || '—', tt:q.lb, cls:q.cls, ghiChu:p.ghiChu, file:p.plhd,

  });
}
function buildHoSoRows(rowsByName){
  let out = [];
  if (rowsByName['RFA'])        out = out.concat(parseRFA(rowsByName['RFA']));

  if (rowsByName['Chỉ thị SI']) out = out.concat(parseSI(rowsByName['Chỉ thị SI']));

}
function hoSoSummary(rows){

/* ══════════════════════════════════════════════════════════════
   QUY ĐỔI GẠCH: thùng → m²
   Gạch nhập/tồn tính bằng m² nhưng XUẤT bằng "thùng".
   Bảng quy cách lấy đúng từ TILE_BOX_M2 trong Code.gs của WMS
   (XUẤT NHẬP KHO/1: Gửi lên git/Code.gs — dòng 1601).
   Sửa quy cách thì sửa cả 2 nơi cho khớp.
   ══════════════════════════════════════════════════════════════ */
const TILE_BOX_M2 = {
  'V-BBQ-04':0.36, 'V-FIN-0016':1.44, 'V-FIN-001A':2.16, 'V-FIN-001B':1.44,
  'V-FIN-004A':1.44, 'V-FIN-004B':1.44, 'V-FIN-005A':1.17, "V-FIN-005A'":1.17,
  'V-FIN-005B':1.125, 'V-FIN-007':1.44, 'V-FIN-009':1.4256, 'V-FIN-057':0.72,
  'VAC-008':0.2166
};
const isBoxUnit = u => /th[uù]ng/i.test(String(u || ''));
/* Tìm quy cách m²/thùng theo mã, nếu mã trống thì dò trong tên vật tư */
function tileFactor(code, name){
  const c = String(code || '').toUpperCase().trim();
  if (TILE_BOX_M2[c]) return TILE_BOX_M2[c];
  const s = String(name || '').toUpperCase();
  for (const k in TILE_BOX_M2) if (s.indexOf(k) >= 0) return TILE_BOX_M2[k];
  return 0;
}
/* Trả về {v, u, note}: v/u để hiển thị, note là số thùng gốc ghi trong ngoặc */
function qtyM2(code, name, qty, unit){
  const q = +qty || 0;
  if (!isBoxUnit(unit)) return {v:q, u:String(unit || ''), note:''};
  const f = tileFactor(code, name);
  if (!f) return {v:q, u:String(unit || ''), note:''};
  return {v: Math.round(q * f * 10) / 10, u:'m²', note: fmt(q) + ' thùng × ' + f + ' m²'};
}
/* m² đã nhận về theo bảng tồn nền (để đối chiếu) */

/* ══════════════════════════════════════════════════════════════
   ĐỐI CHIẾU KẾ HOẠCH BCH ↔ KẾ HOẠCH GIAO HÀNG NHÀ MÁY
   Lịch 18 tuần lấy từ PDF nhà máy (SNAP.cmp — nguồn duy nhất có).
   Mọi thứ còn lại (đã đặt · mẫu căn · số căn · tên) tính LIVE từ
   sheet 9.MA TRẬN XUẤT HÀNG mỗi lần đồng bộ.
   ══════════════════════════════════════════════════════════════ */
function parentOf(ma){ return String(ma || '').replace(/-[A-Za-z0-9]{1,3}$/, ''); }

function cmpBuild(){
  DB.cmp = {};
  const C = SNAP.cmp; if (!C || !C.rows) return;
  const W = C.weeks, M = (DB.factory.mocsMeta || []).slice()
    .sort((a, b) => String(a.xk || '').localeCompare(String(b.xk || '')));
  if (!M.length) return;

  /* Gom mã cha từ dữ liệu LIVE */
  const SOCAN = {}, par = {};
  DB.factory.prods.forEach(p => {
    if (p.mau && p.socan) SOCAN[p.mau] = p.socan;
    const k = parentOf(p.ma), R = C.rows[k]; if (!R) return;
    const o = par[k] || (par[k] = {ma:k, ten:'', dvt:p.dvt || '', mau:p.mau || '', nhom:p.nhom || '',
                                   boq:R[0], giao:R[1], con:R[2], wk:R[3], dat:0});
    if (!o.ten && p.ten) o.ten = p.ten;
    if (!o.nhom && p.nhom) o.nhom = p.nhom;
    o.dat = Math.max(o.dat, p.dat || 0);          // hạng mục con nào đặt nhiều nhất
  });
  const grp = {};
  Object.keys(par).forEach(k => { const o = par[k];
    if (!o.nhom || !o.mau) return;
    (grp[o.nhom + '|' + o.mau] = grp[o.nhom + '|' + o.mau] || []).push(o); });

  /* Số căn cộng dồn của từng mẫu qua các mốc cùng nhóm */
  const cum = {}, need = {};
  M.forEach(m => Object.keys(m.mau || {}).forEach(k => {
    const key = m.nhom + '|' + k;
    cum[key] = (cum[key] || 0) + m.mau[k];
    need[m.ma + '|' + k] = cum[key];
  }));

  const supply = (o, iso) => { let s = o.giao;
    for (const i in o.wk) if (W[+i] <= iso) s += o.wk[i];
    return s; };
  const reach = (o, q) => { if (o.giao >= q - 0.01) return SRC.factory.ngay || todayISO();
    let a = o.giao;
    for (let i = 0; i < W.length; i++){ a += o.wk[i] || 0; if (a >= q - 0.01) return W[i]; }
    return null; };
  const first = o => { for (let i = 0; i < W.length; i++) if (o.wk[i]) return W[i]; return null; };
  const ordered = o => o.dat >= o.boq * 0.999 - 0.01;

  M.forEach(m => {
    let tot = 0, ok = 0, nod = 0, last = null, bd = null;
    const miss = [];
    Object.keys(m.mau || {}).forEach(mau => {
      const S = SOCAN[mau] || 0, n = need[m.ma + '|' + mau] || 0;
      if (!S) return;
      (grp[m.nhom + '|' + mau] || []).forEach(o => {
        const q = o.boq * n / S; if (q <= 0.001) return;
        const s = supply(o, m.xk), od = ordered(o), f = reach(o, q);
        if (!od){ nod++;
          if (s < q - 0.01) miss.push({ma:o.ma, ten:o.ten, dvt:o.dvt, mau:mau, can:q, co:s,
            thieu:q - s, xong:f, tre:f ? dayDiff(m.xk, f) : null, od:0});
          return; }
        tot++;
        if (s >= q - 0.01){ ok++; return; }
        miss.push({ma:o.ma, ten:o.ten, dvt:o.dvt, mau:mau, can:q, co:s, thieu:q - s,
          xong:f, tre:f ? dayDiff(m.xk, f) : null, od:1});
        if (f && (!last || f > last)) last = f;
        const b0 = first(o); if (b0 && (!bd || b0 < bd)) bd = b0;
      });
    });
    miss.sort((a, b) => (b.tre || 0) - (a.tre || 0));
    DB.cmp[m.ma] = {bd, xong:last, tre: last ? dayDiff(m.xk, last) : 0,
                    tot, ok, thieu: tot - ok, nod, miss};
  });
}
function dayDiff(a, b){ return Math.round((new Date(b) - new Date(a)) / 86400000); }

  ])});

  /* ── Giá trị hợp đồng & tiền ── */
  h += card({span:'span6', title:'Giá trị hợp đồng và tiền đã chi',

      {k:'CĐT đã thanh toán', v:ipc.paid || 0, c:'var(--green)'},
      {k:'Giá trị HĐ/PO NTP', v:p.gtHD, c:'var(--indigo)'},
      {k:'Sản lượng IPC NTP', v:p.gtIPC, c:'var(--blue)'},
      {k:'NTP chờ chi', v:p.wait, c:'var(--orange)'},
      {k:'NTP đã chi', v:p.paid, c:'var(--teal)'}
    ], vf: money, ml:140, rh:32, h:206})});

  /* ── Khối lượng còn phải xử lý ── */
  const load = [
    {k:'Mã chưa ra hàng', v:f.chuaRa, c:'var(--orange)'},
    {k:'Mã chưa đặt hàng', v:f.chuaDat, c:'var(--red)'},
    {k:'Hồ sơ chờ duyệt', v:hsPend, c:'var(--indigo)'},
    {k:'Căn chưa khởi công', v:c.chuaTC, c:'var(--purple)'},
    {k:'Hồ sơ bị từ chối', v:hsRej, c:'var(--pink)'},
    {k:'Căn thiếu mặt bằng', v:c.chuaBG, c:'var(--teal)'},
    {k:'Phát sinh PMI mở', v:pmiOpen, c:'var(--blue)'},
    {k:'Việc BCH quá hạn', v:t.late, c:'var(--red)'}
  ].filter(x => x.v > 0).sort((a,b) => b.v - a.v);
  h += card({span:'span6', title:'Khối lượng còn phải xử lý',
    body: hbarChart({items: load, vf: v => fmt(v), unit:'Số lượng', ml:150, rh:26, h:206,
      onClick:"drillLoad($L)"})});

  /* ── Phân khu ── */
  const byKhu = {};
  DB.constr.villas.forEach(v => { (byKhu[v.khu] = byKhu[v.khu] || []).push(v); });
  const khus = Object.keys(byKhu).sort();
  h += card({span:'span6', title:'Tiến độ theo phân khu',
    body: legend([{k:'Bàn giao mặt bằng', c:HEX[5]},{k:'Thi công', c:HEX[0]}]) + barChart({
      labels: khus.map(k => k.replace('Khu ','')),
      series: [
        {name:'Bàn giao mặt bằng', color:'var(--teal)', data: khus.map(k => Math.round(byKhu[k].reduce((a,x)=>a+x.bg,0)/byKhu[k].length))},
        {name:'Thi công', color:'var(--blue)', data: khus.map(k => Math.round(byKhu[k].reduce((a,x)=>a+x.tc,0)/byKhu[k].length))}
      ], vf: v => Math.round(v) + '%', h:214, onClick: "setF('khu', 'Khu ' + $L)"})});

  /* ── Chuỗi cung ứng ── */
  h += card({span:'span6', title:'Chuỗi cung ứng nhà máy',
    body: funnelChart({steps:[
      {k:'BOQ cần sản xuất', v:f.boq, c:'var(--c9)'},
      {k:'Đã đặt hàng', v:f.dat, c:'var(--blue)'},

    ], vf: v => fmt(v), h:150})
    + '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px">'
    + [['Đã đặt đủ', f.duDat, 'var(--green)'],['Đặt thiếu', f.thieu, 'var(--orange)'],['Chưa đặt', f.chuaDat, 'var(--red)']]
      .map(x => '<div style="text-align:center;padding:11px 6px;background:var(--fill2);border-radius:12px">'
        + '<div class="num" style="font-size:21px;font-weight:700;letter-spacing:-.02em;color:' + x[2] + '">' + x[1] + '</div>'
        + '<div style="font-size:12.5px;color:var(--label2);margin-top:2px">' + x[0] + '</div></div>').join('') + '</div>'});

  /* ── Cảnh báo ── */

  h += card({span:'span12', title:'Cảnh báo cần xử lý', flush:true,
    body: alerts.length ? '<div class="scroll"><table class="tbl"><thead><tr><th>Mức</th><th>Hệ thống</th><th>Nội dung</th><th class="r">Số lượng</th></tr></thead><tbody>'
      + alerts.map(a => '<tr><td>' + statTag(a.lv === 'bad' ? 'Cao' : a.lv === 'warn' ? 'Vừa' : 'Thấp', a.lv) + '</td>'
        + '<td style="color:var(--label2)">' + esc(a.he) + '</td><td>' + esc(a.msg) + '</td>'
        + '<td class="r num" style="font-weight:600">' + a.n + '</td></tr>').join('')
      + '</tbody></table></div>' : '<div class="empty">Không có cảnh báo</div>'});
  h += '</div>';
  return h;
}

function buildAlerts(){
  const a = [], c = constrStats(), f = facTotals(), t = taskStats(), p = payTotals();
  if (t.late) a.push({lv:'bad', he:'Giao việc', msg:'Công việc quá hạn chưa hoàn thành', n:t.late});
  if (f.chuaDat) a.push({lv:'bad', he:'Nhà máy', msg:'Mã sản phẩm chưa đặt hàng', n:f.chuaDat});
  if (f.thieu) a.push({lv:'warn', he:'Nhà máy', msg:'Mã đặt hàng còn thiếu so với BOQ', n:f.thieu});
  if (f.nt3) a.push({lv:'warn', he:'Nhà máy', msg:'Mã còn phải nghiệm thu lần 3', n:f.nt3});
  const lateMoc = DB.factory.mocs.filter(m => m.ct && daysTo(m.ct) < 0 && m.n_cangiao > 0);
  if (lateMoc.length) a.push({lv:'bad', he:'Nhà máy', msg:'Mốc giao hàng đã quá hạn còn hàng chưa về', n:lateMoc.length});
  if (c.chuaTC) a.push({lv:'warn', he:'Thi công', msg:'Căn chưa bắt đầu thi công', n:c.chuaTC});
  if (c.chuaBG) a.push({lv:'warn', he:'Thi công', msg:'Căn nhận mặt bằng dưới 20%', n:c.chuaBG});
  if (p.wait) a.push({lv:'warn', he:'Thanh toán', msg:'Giá trị BCH đã xác nhận nhưng chưa chi (' + money(p.wait) + ')', n: allIPC().filter(x => x.type==='confirmed').length});
  const pmiOpen = (DB.pay.pmi||[]).filter(x => pmiState(x).open);
  const pmiLate = pmiOpen.filter(x => x.days > 30);
  if (pmiLate.length) a.push({lv:'bad', he:'Phát sinh', msg:'PMI mở quá 30 ngày chưa chốt', n:pmiLate.length});
  else if (pmiOpen.length) a.push({lv:'warn', he:'Phát sinh', msg:'PMI đang mở', n:pmiOpen.length});
  const rej = DB.constr.hoso.reduce((s,x) => s+x.reject, 0);
  if (rej) a.push({lv:'warn', he:'Hồ sơ', msg:'Hồ sơ đệ trình bị từ chối cần làm lại', n:rej});
  const het = DB.wms.inv.filter(x => (+x.stock||0) <= 0 && (+x.outQty||0) > 0);
  if (het.length) a.push({lv:'warn', he:'Kho', msg:'Mã vật tư đã hết tồn', n:het.length});
  const gr = (DB.constr.groups||[]).filter(g => g.tt === 'alert');
  if (gr.length) a.push({lv:'bad', he:'Thi công', msg:'Nhóm thi công báo động (' + gr.map(x=>x.nhom).join(', ') + ')', n:gr.length});
  const rank = {bad:0, warn:1, info:2};
  return a.sort((x,y) => rank[x.lv] - rank[y.lv] || y.n - x.n);
}

/* ─────────────── 2 · TIẾN ĐỘ 104 CĂN ─────────────── */
const TR_SHORT = ['Sắt','Thạch cao','Sơn nước','Sơn h.ứng','Chống thấm','Ốp gạch','Ốp đá','Kính','Mộc'];

  h += kpi({span:'span3', label:'Bàn giao mặt bằng TB', value:c.bg, unit:'%', color:'var(--c6)', sub:c.bgDone + ' căn đã đủ mặt bằng', bar:c.bg});
  h += kpi({span:'span3', label:'Căn chưa khởi công', value:c.chuaTC, color:'var(--c4)', sub:'0% tiến độ thi công', bar:pct(c.chuaTC, c.n)});
  h += kpi({span:'span3', label:'Căn đã vượt 20%', value:c.tcTop, color:'var(--c2)', sub:'nhóm dẫn đầu tiến độ', bar:pct(c.tcTop, c.n)});

    sub: v.filter(x => x.trades[i] > 0).length + ' căn đã triển khai'}));

      points: v.map(x => ({k: x.ma + ' · ' + x.khu, x: x.bg, y: x.tc, c: kc[x.khu] || HEX[8], r: 4.6})),
      xl:'% Bàn giao mặt bằng', yl:'% Thi công', h:250, vf: n => fmt(n,1) + '%'})});

  /* Heatmap */
  const cellColor = p => p <= 0 ? 'var(--sep2)' : p >= 100 ? HEX[1] : p >= 60 ? '#39B99C' : p >= 30 ? HEX[2] : p >= 10 ? '#F0894A' : '#E9A5A7';
  let hm = '<div class="hm"><table><thead><tr><th class="vil">Căn</th><th>Bàn giao</th><th>Thi công</th>'
    + TR_SHORT.map(t => '<th>' + esc(t) + '</th>').join('') + '</tr></thead><tbody>';
  v.forEach(x => {
    const cell = (p, t) => '<td style="background:' + cellColor(p) + ';color:' + (p <= 0 ? 'var(--label3)' : '#fff') + '"'

  h += card({span:'span7', title:'Ma trận tiến độ ' + v.length + ' căn', body: scale + hm});

      + '</tbody></table></div>'});
  h += '</div>';
  return h;
}

/* ─────────────── 3 · NHÂN LỰC & KẾ HOẠCH ─────────────── */
function pgResource(){
  const C = DB.constr, ramp = C.ramp;
  /* Gộp 2 đợt kế hoạch T21–T25 và T26–T30 thành 1 dải 10 tuần */
  const wk1 = C.mpWeeks || [], wk2 = C.mpWeeks2 || [];
  const wk = wk1.concat(wk2);
  const norm = t => String(t).replace(/\s*\/\s*Built-in/i, '').trim();
  const names = [];
  (C.mpPlan||[]).forEach(r => { if (names.indexOf(norm(r.ten)) < 0) names.push(norm(r.ten)); });
  (C.mpPlan2||[]).forEach(r => { if (names.indexOf(norm(r.ten)) < 0) names.push(norm(r.ten)); });
  const find = (arr, nm) => (arr||[]).find(r => norm(r.ten) === nm);
  const mp = names.map(nm => {
    const a = find(C.mpPlan, nm), b = find(C.mpPlan2, nm);
    return {ten: nm, v: (a ? a.v : wk1.map(() => 0)).concat(b ? b.v : wk2.map(() => 0))};
  });
  const totPlan = wk.map((_, i) => mp.reduce((s, r) => s + (+r.v[i] || 0), 0));
  const peakWeek = totPlan.indexOf(Math.max.apply(null, totPlan));
  const peak = Math.max.apply(null, ramp.map(r => r.kh));
  const cur = ramp.find(r => r.tt != null);
  let h = '<div class="grid">';
  h += kpi({span:'span3', label:'Nhân lực đỉnh kế hoạch', value:fmt(peak), unit:'người', color:'var(--c1)',
    sub:'tháng ' + (ramp.find(r => r.kh === peak)||{}).thang, bar:100});
  h += kpi({span:'span3', label:'Thực tế ghi nhận', value: cur ? fmt(cur.tt) : '—', unit:'người', color:'var(--c3)',
    sub: cur ? cur.thang + ' · thiếu ' + fmt(Math.max(0, cur.kh - cur.tt)) + ' so với KH' : 'chưa cập nhật', bar: cur ? pct(cur.tt, cur.kh) : 0});
  h += kpi({span:'span3', label:'Tuần cao điểm nhân lực', value:fmt(totPlan[peakWeek]||0), unit:'người', color:'var(--c2)',
    sub: String(wk[peakWeek]||'').split(' ')[0] + ' · ' + String(wk[peakWeek]||'').split(' ').slice(1).join(' '), bar:100});
  h += kpi({span:'span3', label:'Nhóm thi công báo động', value:(C.groups||[]).filter(g => g.tt === 'alert').length,
    color:'var(--c4)', sub:(C.groups||[]).length + ' nhóm đang triển khai', bar:pct((C.groups||[]).filter(g=>g.tt==='alert').length, (C.groups||[]).length)});

  h += card({span:'span7', title:'Ramp-up nhân lực vs lũy kế căn hoàn thành',
    body: legend([{k:'Nhân lực kế hoạch', c:HEX[0]},{k:'Nhân lực thực tế', c:HEX[2]},{k:'Lũy kế căn HT', c:HEX[1]}])
      + comboChart({labels: ramp.map(r => r.thang),
        bars:[{name:'Nhân lực KH', color:'var(--c1)', data: ramp.map(r => r.kh)},
              {name:'Thực tế', color:'var(--c3)', data: ramp.map(r => r.tt || 0)}],
        lines:[{name:'Lũy kế căn HT', color:'var(--c2)', data: ramp.map(r => r.luyke)}],
        vf: v => fmt(v), vf2: v => fmt(v), h:236}),
    foot: esc((ramp[ramp.length-1]||{}).ghichu || '')});

  h += card({span:'span5', title:'Nhân lực kế hoạch theo hạng mục',
    body: legend(mp.map((r,i) => ({k:r.ten, c:HEX[i%9]})))
      + barChart({labels: wk.map(w => String(w).split(' ')[0]),
        series: mp.map((r,i) => ({name:r.ten, color:'var(--c' + ((i%9)+1) + ')', data:r.v})),
        stacked:true, vf: v => fmt(v), h:222, rot:false}),
    foot:'Tổng kế hoạch cả 10 tuần: <b class="num">' + fmt(totPlan.reduce((a,b) => a+b, 0)) + '</b> lượt người-tuần'});

  h += card({span:'span5', title:'Tình trạng các nhóm thi công', sub:(C.groups||[]).length + ' nhóm', flush:true,
    body:'<div class="scroll tall"><table class="tbl"><thead><tr><th>Nhóm</th><th>Phạm vi căn</th><th>Trạng thái</th><th>Vấn đề / hành động</th></tr></thead><tbody>'
      + (C.groups||[]).map(g => '<tr><td style="font-weight:600">' + esc(g.nhom) + '</td><td class="num">' + esc(g.can) + '</td>'
        + '<td>' + statTag(g.tt === 'ok' ? 'Đúng tiến độ' : g.tt === 'warn' ? 'Theo dõi' : g.tt === 'alert' ? 'Báo động' : 'Chưa rõ',
                            g.tt === 'ok' ? 'ok' : g.tt === 'warn' ? 'warn' : g.tt === 'alert' ? 'bad' : 'mute') + '</td>'
        + '<td style="font-size:11.5px"><div>' + esc(g.ghichu) + '</div><div style="color:var(--label3);margin-top:1px">→ ' + esc(g.hanhdong) + '</div></td></tr>').join('')
      + '</tbody></table></div>'});

  h += card({span:'span7', title:'Kế hoạch thi công chi tiết theo tuần', sub:(C.sched||[]).length + ' đầu việc · T21 → T30', flush:true,
    body:'<div class="scroll tall"><table class="tbl"><thead><tr><th>Tuần</th><th>Nhóm</th><th>Căn</th><th>Hạng mục</th><th>Nhân lực</th><th>Tình trạng</th></tr></thead><tbody>'
      + (C.sched||[]).map(s => {
          const cl = /alert/i.test(s.tt) ? 'bad' : /warn/i.test(s.tt) ? 'warn' : /ok/i.test(s.tt) ? 'ok' : 'info';
          const lb = /alert/i.test(s.tt) ? 'Báo động' : /warn/i.test(s.tt) ? 'Theo dõi' : /ok/i.test(s.tt) ? 'Đúng KH' : (s.tt || '—');
          return '<tr><td style="font-weight:600">' + esc(s.w) + '<div style="font-size:10px;color:var(--label3);font-weight:400">' + esc(s.tg) + '</div></td>'
          + '<td style="color:var(--label2)">' + esc(s.nhom) + '</td><td class="num">' + esc(s.can) + '</td>'
          + '<td style="font-size:11.5px">' + esc(s.hm) + (s.note ? '<div style="color:var(--c3);margin-top:1px">' + esc(s.note) + '</div>' : '') + '</td>'
          + '<td style="font-size:11.5px;color:var(--label2)">' + esc(s.nl) + '</td>'
          + '<td>' + statTag(lb, cl) + '</td></tr>'; }).join('')
      + '</tbody></table></div>'});
  h += '</div>';
  return h;
}

function openVilla(ma){
  const v = DB.constr.villas.find(x => x.ma === ma); if (!v) return;
  const TR = DB.constr.trades;
  let b = mGroup([
    mRow('Phân khu', esc(v.khu)),
    mRow('Bàn giao mặt bằng', dataBar(v.bg, 100, 'var(--teal)', fmt(v.bg,1) + '%')),
    mRow('Tiến độ thi công', dataBar(v.tc, 100, v.tc <= 0 ? 'var(--red)' : 'var(--blue)', fmt(v.tc,1) + '%')),
    mRow('Chênh lệch mặt bằng − thi công', '<span class="num">' + fmt(v.bg - v.tc, 1) + '%</span>')
  ]);
  b += mTitle('Tiến độ 9 hạng mục');
  b += mGroup(TR.map((t, i) => mRow(t, dataBar(v.trades[i], 100,
    v.trades[i] >= 100 ? 'var(--green)' : v.trades[i] > 0 ? 'var(--blue)' : 'var(--label3)',
    fmt(v.trades[i],1) + '%'))));
  if ((v.ntTrades || []).some(x => x > 0)){
    b += mTitle('Nghiệm thu');
    b += mGroup([mRow('% nghiệm thu tổng', dataBar(v.nt, 100, 'var(--purple)', fmt(v.nt,1) + '%'))].concat(
      TR.map((t, i) => (v.ntTrades[i] > 0 ? mRow(t, fmt(v.ntTrades[i],1) + '%') : '')).filter(Boolean)));
  }
  if (v.note){ b += mTitle('Ghi chú thi công'); b += mGroup([mRow('Nội dung', esc(v.note))]); }
  openSheet(esc(v.ma), esc(v.khu) + ' · thi công ' + fmt(v.tc,1) + '%', b);

    if (worst.length){
      b += mTitle(k === 'dat' ? 'Thiếu đơn nhiều nhất' : 'Chưa giao nhiều nhất');
      b += mGroup(worst.map(x => mRow(x.ma + ' · ' + String(x.ten).slice(0, 38),
        '<span class="num">' + fmt(k === 'dat' ? x.boq - x.dat : x.dat - x.ra) + ' ' + esc(x.dvt) + '</span>')));
    }
    return openSheet(k === 'dat' ? 'Đặt hàng nhà máy' : 'Giao hàng nhà máy', f.n + ' mã sản phẩm', b);
  }
  if (k === 'ntp'){

      mRow('Giá trị HĐ/PO', '<span class="num">' + fmt(p.gtHD) + '</span>'),
      mRow('Sản lượng IPC lũy kế', '<span class="num">' + fmt(p.gtIPC) + '</span>'),
      mRow('Đã thanh toán', '<span class="num" style="color:var(--green)">' + fmt(p.paid) + '</span>'),
      mRow('BCH xác nhận · chờ chi', '<span class="num" style="color:var(--orange)">' + fmt(p.wait) + '</span>'),
      mRow('Chưa xác nhận', '<span class="num">' + fmt(p.pend) + '</span>')
    ]);
    b += mTitle('Theo thầu phụ');
    b += mGroup(DB.pay.ct.map(x => {
      const hd = x.pos.reduce((a,o) => a + o.gtHD, 0), ipc = x.pos.reduce((a,o) => a + o.tongIPC, 0);
      return mRow(x.ten, '<span class="num">' + money(ipc) + ' / ' + money(hd) + ' · ' + pct(ipc, hd) + '%</span>');
    }));
    return openSheet('Thanh toán thầu phụ', p.nCT + ' thầu phụ · ' + p.nPO + ' PO', b);
  }
  if (k === 'cdt'){
    const D = DB.pay.ipc, s2 = (D && D.sum) || {};

      mRow('Tổng HĐ + PLHĐ sau VAT', '<span class="num">' + fmt(s2.total || 0) + '</span>'),

      mRow('Còn lại theo hợp đồng', '<span class="num">' + fmt(s2.remain || 0) + '</span>'),

      mRow('Sản lượng đang trình', '<span class="num">' + fmt(s2.slTrinh || 0) + '</span>')
    ]);
    if (D && D.ipcs.length){
      b += mTitle('Các kỳ IPC');
      b += mGroup(D.ipcs.map(x => mRow(x.name, '<span class="num">trình ' + money(x.sl)
        + (x.paid ? ' · đã trả ' + money(x.paid) : '') + '</span>')));
    }
    return openSheet('Chủ đầu tư đã thanh toán', (s2.paidPct || pct(s2.paid, s2.total) + '%') + ' giá trị hợp đồng', b);
  }
  if (k === 'viec'){
    const open2 = DB.tasks.filter(x => x.status !== 'Hoàn thành');

      mRow('Tổng công việc', t.n), mRow('Hoàn thành', '<span style="color:var(--green)">' + t.done + '</span>'),
      mRow('Đang làm', t.doing), mRow('Chưa bắt đầu', t.todo),

    ]);
    if (open2.length){

        '<span class="num" style="font-size:13px">' + esc(x.person || '') + ' · ' + dVN(x.deadline) + '</span>')));
    }
    return openSheet('Công việc ban chỉ huy', t.done + '/' + t.n + ' hoàn thành', b);
  }
}
