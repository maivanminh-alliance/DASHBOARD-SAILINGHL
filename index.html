    (byNhom[k] = byNhom[k] || {du:0, thieu:0, chua:0, ra:0, boq:0})[x.tt === 'ĐÃ ĐẶT ĐỦ' ? 'du' : x.tt === 'ĐẶT THIẾU' ? 'thieu' : 'chua']++;
    byNhom[k].ra += (+x.ra||0); byNhom[k].boq += (+x.boq||0); });
  const nk = Object.keys(byNhom);
  h += card({span:'span5', title:'Tình trạng đặt hàng theo nhóm sản phẩm',
    body: legend([{k:'Đã đặt đủ', c:HEX[1]},{k:'Đặt thiếu', c:HEX[2]},{k:'Chưa đặt', c:HEX[3]}])
      + barChart({labels: nk, series:[
        {name:'Đã đặt đủ', color:'var(--c2)', data: nk.map(k => byNhom[k].du)},
        {name:'Đặt thiếu', color:'var(--c3)', data: nk.map(k => byNhom[k].thieu)},
        {name:'Chưa đặt', color:'var(--c4)', data: nk.map(k => byNhom[k].chua)}],
        stacked:true, vf: v => fmt(v), h:216, onClick:"setF('nhomNM', $L)"})});

  const byHm = {}; P.forEach(x => { const k = x.hm || '—'; byHm[k] = (byHm[k]||0)+1; });
  h += card({span:'span3', title:'Cơ cấu theo hạng mục',
    body: donutChart({items: Object.keys(byHm).sort((a,b) => byHm[b]-byHm[a]).map((k,i) => ({k, v:byHm[k], c:HEX[i%9]})),
      center: String(f.n), centerSub:'mã', h:218})});

  h += card({span:'span4', title:'Tỷ lệ giao hàng theo mẫu căn',
    body: (function(){ const m = {}; P.forEach(x => { const k = 'Mẫu ' + (x.mau||'?');
        (m[k] = m[k] || {ra:0, boq:0}); m[k].ra += (+x.ra||0); m[k].boq += (+x.boq||0); });
      const ks = Object.keys(m).sort();
      return legend([{k:'Đã ra hàng', c:HEX[1]},{k:'Còn phải ra', c:HEX[8]}]) + barChart({labels: ks, series:[
        {name:'Đã ra hàng', color:'var(--c2)', data: ks.map(k => m[k].ra)},
        {name:'Còn phải ra', color:'var(--c9)', data: ks.map(k => Math.max(0, m[k].boq - m[k].ra))}],
        stacked:true, vf: v => fmt(v), h:216, onClick:"setF('mau', $L)"}); })()});

  /* Lịch mốc giao hàng — gom theo nhóm sản phẩm, kèm mốc thời gian tháng */
  const NHOM_LB = {'FITOUT GỖ':'CỬA & FITOUT GỖ', 'ĐỒ LIỀN TƯỜNG':'ĐỒ LIỀN TƯỜNG', 'ĐỒ RỜI':'ĐỒ RỜI'};
  const NHOM_C  = {'FITOUT GỖ':'var(--green)', 'ĐỒ LIỀN TƯỜNG':'var(--green)', 'ĐỒ RỜI':'var(--green)'};
  const ms = M.slice().sort((a,b) => String(a.ct||'').localeCompare(String(b.ct||'')));
  /* Đối chiếu với PDF kế hoạch giao hàng của nhà máy */
  const CMPI = (SNAP.cmp || {}), CMP = DB.cmp || {};
  const dts = ms.map(m => m.ct).filter(Boolean)
    .concat(ms.map(m => (CMP[m.ma] || {}).xong).filter(Boolean))
    .map(d => +new Date(String(d).slice(0,10)));
  const nowMs = +new Date(todayISO());
  const t0 = new Date(Math.min.apply(null, dts.concat([nowMs])));
  const t1 = new Date(Math.max.apply(null, dts.concat([nowMs])));
  const mStart = new Date(t0.getFullYear(), t0.getMonth(), 1);
  const mEnd = new Date(t1.getFullYear(), t1.getMonth() + 1, 0);
  const MO = [];
  for (let d = new Date(mStart); d <= mEnd; d.setMonth(d.getMonth() + 1))
    MO.push({y:d.getFullYear(), m:d.getMonth(),
      lb:String(d.getMonth() + 1).padStart(2,'0') + '/' + d.getFullYear(),
      days:new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate()});
  const totalDays = MO.reduce((a,x) => a + x.days, 0);
  const posOf = iso => {
    if (!iso) return 0;
    const d = new Date(String(iso).slice(0,10));
    let acc = 0;
    for (let k = 0; k < MO.length; k++){
      if (MO[k].y === d.getFullYear() && MO[k].m === d.getMonth()) return (acc + d.getDate() - 1) / totalDays * 100;
      acc += MO[k].days;
    }
    return d < mStart ? 0 : 100;
  };
  /* Tháng/năm nằm ngay trong ô của từng dòng, ở băng trên; hai thanh nằm băng dưới */
  const scaleHtml = MO.map(x => '<div class="mo" style="width:' + (x.days / totalDays * 100).toFixed(3) + '%">'
    + x.lb + '</div>').join('');
  const todayP = posOf(todayISO());

  const mocNhom = {};
  ms.forEach(m => { const k = m.nhom || 'KHÁC'; (mocNhom[k] = mocNhom[k] || []).push(m); });
  let gt = '';
  ['FITOUT GỖ','ĐỒ LIỀN TƯỜNG','ĐỒ RỜI'].concat(Object.keys(mocNhom).filter(k => !NHOM_C[k]))
    .filter(k => mocNhom[k] && mocNhom[k].length).forEach(k => {
      const c = NHOM_C[k] || 'var(--purple)';
      gt += '<div class="mstone"><div class="mst-h"><i style="background:' + c + '"></i>'
        + esc(NHOM_LB[k] || k) + '<b>' + mocNhom[k].length + ' đợt</b></div><div class="mst-box">';
      mocNhom[k].forEach(m => {
        const thieuDon = (m.n_chuadat || 0) + (m.n_thieu || 0);
        const dDat = daysTo(m.han_dat), dCt = daysTo(m.ct);
        const q = CMP[m.ma] || {};
        /* XANH — kế hoạch BCH: hạn đặt hàng → về công trường */
        const x0 = posOf(m.han_dat || m.xk || m.ct), x1 = posOf(m.ct);
        const L = Math.max(0, Math.min(x0, x1)), W = Math.min(Math.max(3, Math.abs(x1 - x0)), 100 - L);
        /* CAM — kế hoạch giao hàng nhà máy: bắt đầu giao → giao xong */
        let nmBar = '';
        if (q.xong){
          const y0 = posOf(q.bd || m.ct), y1 = posOf(q.xong);
          const L2 = Math.max(0, Math.min(y0, y1)), W2 = Math.min(Math.max(2, Math.abs(y1 - y0)), 100 - L2);
          nmBar = '<div class="fill2" style="left:' + L2.toFixed(2) + '%;width:' + W2.toFixed(2) + '%"></div>'
            + '<div class="dot2" style="left:calc(' + Math.min(99.2, Math.max(0.8, y1)).toFixed(2) + '% - 4px)"></div>'
            + (q.tre > 0 ? (y1 > 80
                ? '<div class="tre r" style="right:' + (100 - y1).toFixed(2) + '%">+' + q.tre + ' ngày</div>'
                : '<div class="tre" style="left:' + y1.toFixed(2) + '%">+' + q.tre + ' ngày</div>') : '');
        }
        gt += '<div class="mst" onclick="openMoc(\'' + esc(m.ma) + '\')">'
          + '<div class="mst-t"><span>' + esc(m.ten) + '</span></div>'
          + '<div class="mst-bar">' + scaleHtml
          + '<div class="fill" style="left:' + L.toFixed(2) + '%;width:' + W.toFixed(2) + '%"></div>'
          + '<div class="cap" style="left:calc(' + L.toFixed(2) + '% - 2px)"></div>'
          + '<div class="dot" style="left:calc(' + Math.min(99.2, Math.max(0.8, x1)).toFixed(2) + '% - 4px)"></div>'
          + nmBar
          + (todayP >= 0 && todayP <= 100 ? '<div class="tdy" style="left:' + todayP.toFixed(2) + '%"></div>' : '')
          + '</div>'
          + '<div class="mst-f">' + (q.xong
              ? 'BCH cần về đủ <b style="color:var(--blue)">' + dVN(m.ct) + '</b> · nhà máy giao xong '
                + '<b style="color:var(--warntx)">' + dVN(q.xong) + '</b>'
                + (q.tre > 0 ? ' — trễ <b style="color:var(--warntx)">' + q.tre + ' ngày</b>' : '')
              : (dCt == null ? '' :
                dCt < 0 ? 'Đã <b class="warn">quá hạn ' + (-dCt) + ' ngày</b> mà còn <b>' + m.n_cangiao + '</b> mã chưa giao đủ'
                        : 'Còn <b>' + dCt + '</b> ngày để giao ra công trường đủ <b>' + m.n_cangiao + '</b> mã đã đặt hàng'))
          + '</div></div>';
      });
      gt += '</div></div>';
    });
  const lg = '<div class="mst-lg">'
    + '<span><i style="background:var(--blue)"></i>Kế hoạch BCH — hạn đặt hàng đến ngày về công trình</span>'
    + '<span><i style="background:var(--orange)"></i>Kế hoạch giao hàng của nhà máy'
    + (CMPI.pdf ? ' (PDF ' + esc(CMPI.pdf) + ')' : '') + '</span>'
    + '<span><i style="background:var(--red);width:3px;height:14px;border-radius:2px"></i>Hôm nay</span>'
    + '</div>';
  h += card({span:'span8', title:'Kế hoạch BCH so với kế hoạch giao hàng nhà máy các món đã đặt hàng', body: lg + gt});

  let R = '';
  /* Tiến độ giao hàng theo hạng mục sản xuất */
  const HM = {};
  P.forEach(x => { const k = x.hm || '—';
    const o = HM[k] = HM[k] || {n:0, boq:0, dat:0, ra:0};
    o.n++; o.boq += (+x.boq||0); o.dat += (+x.dat||0); o.ra += (+x.ra||0); });
  const hmK = Object.keys(HM).sort((a,b) => (HM[b].dat - HM[b].ra) - (HM[a].dat - HM[a].ra));
  R += card({span:'', title:'Tiến độ giao hàng theo hạng mục', flush:true,
    body:'<div class="scroll tall"><table class="tbl"><thead><tr><th>Hạng mục</th>'
      + '<th class="r">Đã giao / đặt</th><th>Còn phải giao</th></tr></thead><tbody>'
      + hmK.map(k => { const o = HM[k], con = Math.max(0, o.dat - o.ra), p = pct(o.ra, o.dat);
          return '<tr' + tipAttr('<b>' + esc(k) + '</b><div class="tr">Số mã<span>' + o.n + '</span></div>'
              + '<div class="tr">BOQ<span>' + fmt(o.boq) + '</span></div>'
              + '<div class="tr">Đã đặt<span>' + fmt(o.dat) + '</span></div>'
              + '<div class="tr">Đã giao<span>' + fmt(o.ra) + '</span></div>') + '>'
            + '<td style="font-weight:600">' + esc(k) + '<div style="font-size:12px;color:var(--label3);font-weight:400">' + o.n + ' mã</div></td>'
            + '<td class="r num" style="white-space:nowrap">' + fmt(o.ra)
              + '<div style="font-size:12px;color:var(--label3)">/ ' + fmt(o.dat) + '</div></td>'
            + '<td>' + dataBar(p, 100, con === 0 ? 'var(--green)' : p >= 50 ? 'var(--orange)' : 'var(--red)',
                fmt(con) + (con ? '' : ' · đủ')) + '</td></tr>'; }).join('')
      + '</tbody></table></div>'});

  /* Mốc sắp tới hạn — lấp cột phải */
  const soon = DB.factory.mocs.slice()
    .filter(m => m.ct)
    .map(m => Object.assign({d: daysTo(m.ct)}, m))
    .sort((a,b) => a.d - b.d).slice(0, 8);
  R += card({span:'', title:'Mốc gần tới hạn nhất', flush:true,
    body:'<table class="tbl"><tbody>' + soon.map(m =>
      '<tr class="clk" onclick="openMoc(\'' + esc(m.ma) + '\')">'
      + '<td><div style="font-weight:600">' + esc(m.ten) + '</div>'
      + '<div style="font-size:12px;color:var(--label3)">Về công trường ' + dVN(m.ct) + '</div></td>'
      + '<td class="r" style="white-space:nowrap"><div class="num" style="font-weight:700;color:'
      + (m.d < 0 ? 'var(--red)' : m.d < 15 ? 'var(--orange)' : 'var(--label)') + '">'
      + (m.d < 0 ? 'trễ ' + (-m.d) : m.d) + ' ngày</div>'
      + '<div style="font-size:12px;color:var(--label3)">' + m.n_cangiao + ' mã chưa giao</div></td></tr>').join('')
      + '</tbody></table>'});

  /* Cơ cấu theo mẫu căn */
  const byMau = {};
  P.forEach(x => { const k = 'Mẫu ' + (x.mau || '?');
    const o = byMau[k] = byMau[k] || {n:0, boq:0, dat:0, ra:0};
    o.n++; o.boq += (+x.boq||0); o.dat += (+x.dat||0); o.ra += (+x.ra||0); });
  const mauK = Object.keys(byMau).sort();
  R += card({span:'', title:'Khối lượng theo mẫu căn', flush:true,
    body:'<table class="tbl"><thead><tr><th>Mẫu</th><th class="r">Đã giao / đặt</th><th>Tỷ lệ</th></tr></thead><tbody>'
      + mauK.map(k => { const o = byMau[k];
        return '<tr><td style="font-weight:600">' + esc(k)
          + '<div style="font-size:12px;color:var(--label3);font-weight:400">' + o.n + ' mã</div></td>'
          + '<td class="r num" style="white-space:nowrap">' + fmt(o.ra)
          + '<div style="font-size:12px;color:var(--label3)">/ ' + fmt(o.dat) + '</div></td>'
          + '<td>' + dataBar(pct(o.ra, o.dat), 100,
              pct(o.ra, o.dat) >= 80 ? 'var(--green)' : pct(o.ra, o.dat) >= 40 ? 'var(--orange)' : 'var(--red)',
              pct(o.ra, o.dat) + '%') + '</td></tr>'; }).join('')
      + '</tbody></table>'});

  h += '<div class="span4" style="display:flex;flex-direction:column;gap:14px;min-width:0">' + R + '</div>';

  h += card({span:'span12', title:'Danh mục mã sản phẩm nhà máy', flush:true,
    body:'<div style="padding:2px 18px 12px">' + facSeg() + '</div>'
      + '<div class="scroll tall">' + ftable({
          id:'facTbl', limit:300,
          rows: facRows,
          onRow: x => "openMa('" + String(x.ma).replace(/'/g, "\\'") + "')",
          cols:[
            {k:'ma',  lb:'Mã', get:x => x.ma, cell:x => '<span class="num" style="font-weight:600;white-space:nowrap">' + esc(x.ma) + '</span>'},
            {k:'ten', lb:'Tên sản phẩm', get:x => x.ten, cell:x => '<span style="display:block;max-width:250px">' + esc(x.ten) + '</span>'},
            {k:'hm',  lb:'Hạng mục', get:x => x.hm, cell:x => '<span style="color:var(--label2);font-size:13px">' + esc(x.hm) + '</span>'},
            {k:'mau', lb:'Mẫu', cls:'c', get:x => x.mau},
            {k:'boq', lb:'BOQ', cls:'r', filter:false, get:x => x.boq, cell:x => '<span class="num">' + fmt(x.boq) + '</span>'},
            {k:'dat', lb:'Đã đặt', cls:'r', filter:false, get:x => x.dat, cell:x => '<span class="num">' + fmt(x.dat) + '</span>'},
            {k:'ra',  lb:'Đã giao', cls:'r', filter:false, get:x => x.ra, cell:x => '<span class="num">' + fmt(x.ra) + '</span>'},
            {k:'con', lb:'Còn phải giao', cls:'r', filter:false, get:x => Math.max(0, x.dat - x.ra),
             cell:x => { const c = TF.view === 'chuadat' ? Math.max(0, x.boq - x.dat) : Math.max(0, x.dat - x.ra);
               return '<span class="num" style="font-weight:700;color:' + (c ? 'var(--red)' : 'var(--green)') + '">' + fmt(c) + '</span>'; }},
            {k:'moc', lb:'Mốc giao', get:x => x.moc || '—',
             cell:x => '<span style="font-size:13px;color:var(--label2);white-space:nowrap">' + esc(x.moc || '—') + (x.han ? ' · ' + dVN(x.han) : '') + '</span>'},
            {k:'tt',  lb:'Trạng thái', get:x => x.tt, cell:x => statTag(x.tt, x.tt === 'ĐÃ ĐẶT ĐỦ' ? 'ok' : x.tt === 'ĐẶT THIẾU' ? 'warn' : 'bad')},
            {k:'ttra', lb:'Giao hàng', get:x => x.tt_ra,
             cell:x => statTag(x.tt_ra === 'ĐÃ RA ĐỦ' ? 'Đã giao đủ' : x.tt_ra === 'RA MỘT PHẦN' ? 'Giao một phần' : 'Chưa giao',
                 x.tt_ra === 'ĐÃ RA ĐỦ' ? 'ok' : x.tt_ra === 'RA MỘT PHẦN' ? 'warn' : 'mute')}
          ]}) + '</div>'});

  h += '</div>';
  return h;
}


/* ══════════ BẢNG NHÀ MÁY: lọc theo từng cột ══════════
   Mặc định ưu tiên mã ĐÃ ĐẶT nhưng nhà máy CHƯA GIAO ĐỦ,
   xếp theo khối lượng còn phải giao giảm dần.                */
const TF = {view:'chuagiao', ma:'', ten:'', hm:'Tất cả', mau:'Tất cả', tt:'Tất cả'};
const TF_VIEW = [
  {k:'chuagiao', lb:'Chưa giao đủ'},
  {k:'chuadat',  lb:'Chưa đặt đủ'},
  {k:'all',      lb:'Tất cả'}
];
function facSeg(){
  const n = facRows().length;
  return '<div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">'
    + '<div class="seg">' + TF_VIEW.map(v => '<button class="' + (TF.view === v.k ? 'on' : '') + '" onclick="setTF(\'view\',\'' + v.k + '\')">' + v.lb + '</button>').join('') + '</div>'
    + '<span id="facTbl_count" style="font-size:13px;color:var(--label2)">' + fmt(n) + ' dòng</span>'
    + '<button class="tbtn" onclick="clearFT(\'facTbl\')">Xoá lọc bảng</button></div>';
}
function facRows(){
  let R = facProds();
  if (TF.view === 'chuagiao') R = R.filter(x => x.dat > 0 && x.ra < x.dat);
  else if (TF.view === 'chuadat') R = R.filter(x => x.dat < x.boq);
  const q = (a,b) => String(a||'').toLowerCase().indexOf(String(b).toLowerCase()) >= 0;
  if (TF.ma)  R = R.filter(x => q(x.ma, TF.ma));
  if (TF.ten) R = R.filter(x => q(x.ten, TF.ten));
  if (TF.hm  !== 'Tất cả') R = R.filter(x => x.hm === TF.hm);
  if (TF.mau !== 'Tất cả') R = R.filter(x => String(x.mau) === TF.mau);
  if (TF.tt  !== 'Tất cả') R = R.filter(x => x.tt === TF.tt);
  const key = TF.view === 'chuadat' ? (x => (x.boq - x.dat)) : (x => (x.dat - x.ra));
  return R.sort((a,b) => key(b) - key(a) || (b.boq - a.boq));
}
function opts(list, cur){
  return ['Tất cả'].concat(list).map(o =>
    '<option value="' + esc(o) + '"' + (o === cur ? ' selected' : '') + '>' + esc(o) + '</option>').join('');
}
function setTF(k, v){
  TF[k] = v;
  if (TBL['facTbl']) TBL['facTbl'].f = {};
  render();
}

/* ══════════ CHI TIẾT KHI BẤM VÀO DÒNG ══════════ */
/* PDF nhà máy dùng mã cha (DA25328-0165), prods dùng mã hạng mục con (…-FT) */
function openMaP(p){
  const P = DB.factory.prods;
  const x = P.find(y => y.ma === p) || P.find(y => String(y.ma).indexOf(p + '-') === 0);
  if (x) openMa(x.ma);
}
function openMa(ma){
  const x = DB.factory.prods.find(p => p.ma === ma); if (!x) return;
  const conDat = Math.max(0, x.boq - x.dat), conGiao = Math.max(0, x.dat - x.ra);
  const moc = DB.factory.mocs.find(m => m.ma === x.moc);
  let b = mGroup([
    mRow('Tên sản phẩm', esc(x.ten)),
    mRow('Hạng mục sản xuất', esc(x.hm)),
    mRow('Nhóm', esc(x.nhom || '—')),
    mRow('Mẫu căn', esc(x.mau)),
    mRow('Số căn áp dụng', fmt(x.socan)),
    mRow('Đơn vị tính', esc(x.dvt))
  ]);
  b += mTitle('Khối lượng');
  b += mGroup([
    mRow('BOQ cần sản xuất', '<span class="num">' + fmt(x.boq) + ' ' + esc(x.dvt) + '</span>'),
    mRow('Đã đặt hàng', '<span class="num">' + fmt(x.dat) + '</span>'),
    mRow('Còn phải đặt', '<span class="num" style="color:' + (conDat ? 'var(--red)' : 'var(--green)') + '">' + fmt(conDat) + '</span>'),
    mRow('Đã giao về công trường', '<span class="num">' + fmt(x.ra) + '</span>'),
    mRow('Còn phải giao', '<span class="num" style="color:' + (conGiao ? 'var(--red)' : 'var(--green)') + '">' + fmt(conGiao) + '</span>'),
    mRow('Tỷ lệ giao / đặt', dataBar(pct(x.ra, x.dat), 100, conGiao ? 'var(--orange)' : 'var(--green)', pct(x.ra, x.dat) + '%'))
  ]);
  b += mTitle('Trạng thái');
  b += mGroup([
    mRow('Đặt hàng', statTag(x.tt, x.tt === 'ĐÃ ĐẶT ĐỦ' ? 'ok' : x.tt === 'ĐẶT THIẾU' ? 'warn' : 'bad')),
    mRow('Giao hàng', statTag(x.tt_ra, x.tt_ra === 'ĐÃ RA ĐỦ' ? 'ok' : x.tt_ra === 'RA MỘT PHẦN' ? 'warn' : 'mute')),
    mRow('Ghi chú trên ma trận', esc(x.note || '—')),
    mRow('Số đợt đã giao', x.giao || 0)
  ]);
  if (moc){
    const d = daysTo(moc.ct);
    b += mTitle('Mốc giao hàng ' + esc(moc.ma));
    b += mGroup([
      mRow('Nội dung mốc', esc(moc.ten)),
      mRow('Phạm vi căn', esc(moc.mota || '—')),
      mRow('Hạn đặt hàng', dVN(moc.han_dat)),
      mRow('Ngày xuất kho', dVN(moc.xk)),
      mRow('Về công trường', '<span style="color:' + (d < 0 ? 'var(--red)' : 'var(--label)') + '">' + dVN(moc.ct)
        + (d != null ? ' · ' + (d < 0 ? 'trễ ' + (-d) + ' ngày' : 'còn ' + d + ' ngày') : '') + '</span>'),
      mRow('Mã trong mốc', moc.n_ma_giao + ' / ' + moc.n_ma + ' đã giao đủ')
    ]);
  }
  openSheet(esc(x.ma), esc(x.ten), b);
}

function openMoc(ma){
  const m = DB.factory.mocs.find(x => x.ma === ma); if (!m) return;
  const P = DB.factory.prods.filter(x => x.moc === ma);
  const dDat = daysTo(m.han_dat), dCt = daysTo(m.ct);
  const thieu = (m.n_chuadat || 0) + (m.n_thieu || 0);
  let b = mGroup([
    mRow('Nhóm sản phẩm', esc(m.nhom || '—')),
    mRow('Phạm vi căn', esc(m.mota || '—')),
    mRow('Số căn', fmt(m.socan))
  ]);
  b += mTitle('Mốc thời gian');
  b += mGroup([
    mRow('Hạn đặt hàng', dVN(m.han_dat) + (dDat != null ? ' <span style="color:' + (dDat < 0 ? 'var(--red)' : 'var(--label2)')
      + '">· ' + (dDat < 0 ? 'quá hạn ' + (-dDat) + ' ngày' : 'còn ' + dDat + ' ngày') + '</span>' : '')),
    mRow('Ngày xuất kho nhà máy', dVN(m.xk)),
    mRow('Về tới công trường', dVN(m.ct) + (dCt != null ? ' <span style="color:' + (dCt < 0 ? 'var(--red)' : 'var(--label2)')
      + '">· ' + (dCt < 0 ? 'quá hạn ' + (-dCt) + ' ngày' : 'còn ' + dCt + ' ngày') + '</span>' : ''))
  ]);
  b += mTitle('Tình hình ' + m.n_ma + ' mã trong mốc');
  b += mGroup([
    mRow('Đã đặt đủ', '<span class="num" style="color:var(--green)">' + m.n_du + '</span>'),
    mRow('Đặt thiếu', '<span class="num" style="color:var(--orange)">' + m.n_thieu + '</span>'),
    mRow('Chưa đặt hàng', '<span class="num" style="color:var(--red)">' + m.n_chuadat + '</span>'),
    mRow('Đã giao đủ', '<span class="num" style="color:var(--green)">' + m.n_raxong + '</span>'),
    mRow('Còn phải giao', '<span class="num" style="color:' + (m.n_cangiao ? 'var(--red)' : 'var(--green)') + '">' + m.n_cangiao + '</span>'),
    mRow('Tỷ lệ giao đủ', dataBar(pct(m.n_raxong, m.n_ma), 100,
      m.n_cangiao ? 'var(--orange)' : 'var(--green)', pct(m.n_raxong, m.n_ma) + '%'))
  ]);
  /* Đối chiếu PDF kế hoạch giao hàng nhà máy */
  const q = (DB.cmp || {})[ma];
  if (q && q.xong){
    b += mTitle('So với kế hoạch giao hàng nhà máy');
    b += mGroup([
      mRow('Nhà máy bắt đầu giao', dVN(q.bd)),
      mRow('Nhà máy giao xong', '<span style="color:var(--warntx)">' + dVN(q.xong) + '</span>'),
      mRow('Trễ so với ngày về công trình', '<span style="color:var(--warntx)">' + q.tre + ' ngày</span>'),
      mRow('Mã đã đặt đủ đáp ứng được', q.ok + ' / ' + q.tot),
      mRow('Mã chưa đặt đủ', q.nod)
    ]);
    if (q.miss && q.miss.length){
      MISS = q.miss;                                  // nguồn cho bảng có bộ lọc
      if (TBL.tMiss) TBL.tMiss.f = {};                 // mở mốc khác thì bỏ lọc cũ
      const mxT = Math.max.apply(null, q.miss.map(x => x.tre || 0).concat([1]));
      const d = n => fmt(n, n % 1 ? 2 : 0);
      b += mTitle('Mã không kịp mốc (' + q.miss.length + ')');
      b += '<div class="mtbl">' + ftable({
        id:'tMiss', limit:200, rows:() => MISS, onRow:x => "openMaP('" + x.ma + "')",
        cols:[
          {k:'ma',   lb:'Mã', get:x => x.ma},
          {k:'ten',  lb:'Tên sản phẩm', get:x => x.ten || '(không tên)'},
          {k:'mau',  lb:'Loại căn', cls:'c', get:x => x.mau ? 'Mẫu ' + x.mau : '—',
           cell:x => statTag(x.mau ? 'Mẫu ' + x.mau : '—', 'info')},
          {k:'can',  lb:'Cần', cls:'r num', filter:false, get:x => x.can,
           cell:x => d(Math.round(x.can * 100) / 100) + ' <span style="color:var(--label3);font-size:11px">' + esc(x.dvt || '') + '</span>'},
          {k:'co',   lb:'Có', cls:'r num', filter:false, get:x => x.co, cell:x => d(Math.round(x.co * 100) / 100)},
          {k:'xong', lb:'NM xong', cls:'c', get:x => dVN(x.xong)},
          {k:'tre',  lb:'Trễ', cls:'r', filter:false, get:x => x.tre,
           cell:x => x.tre == null ? '—' : dataBar(x.tre, mxT, 'var(--orange)', x.tre + ' ngày')},
          {k:'od',   lb:'Đặt hàng', get:x => x.od ? 'Đã đặt' : 'Chưa đặt',
           cell:x => statTag(x.od ? 'Đã đặt' : 'Chưa đặt', x.od ? 'warn' : 'bad')}
        ]}) + '</div>';
    }
  }
  const worst = P.filter(x => x.dat < x.boq || x.ra < x.dat)
    .sort((a,b2) => ((b2.boq - b2.dat) + (b2.dat - b2.ra)) - ((a.boq - a.dat) + (a.dat - a.ra))).slice(0, 12);
  if (worst.length){
    b += mTitle('Mã cần thúc (' + worst.length + ' / ' + P.length + ')');
    b += mGroup(worst.map(x => mRow(x.ma + ' · ' + String(x.ten).slice(0, 40),
      '<span class="num" style="font-size:13px">Đã đặt ' + fmt(x.dat)
      + '<span style="color:var(--label3)">/' + fmt(x.boq) + '</span>'
      + ' · Chưa giao ' + fmt(Math.max(0, x.dat - x.ra)) + '</span>')));
  }
  openSheet(esc(m.ten), (thieu ? thieu + ' mã thiếu đơn · ' : '') + m.n_cangiao + ' mã chưa giao đủ', b);
}

/* ─────────────── 6 · KHO VẬT TƯ (WMS) ─────────────── */
function pgStock(){
  const inv = wmsInv(), tx = DB.wms.tx;
  const stock = inv.reduce((s,x) => s + (+x.stock||0), 0);
  const hetDung = inv.filter(x => (+x.stock||0) <= 0 && (+x.outQty||0) > 0).length;
  const chuaNhan = inv.filter(x => (+x.inQty||0) === 0 && (+x.outQty||0) === 0).length;
  const nIn = tx.filter(x => x.type === 'in').length, nOut = tx.filter(x => x.type === 'out').length;
  let h = '<div class="grid">';
  h += kpi({span:'span3', label:'Phiếu nhập xuất', value:fmt(DB.wms.logTotal), color:'var(--c1)',
    sub:nIn + ' phiếu nhập · ' + nOut + ' phiếu xuất gần đây', bar:100});
  h += kpi({span:'span3', label:'Mã vật tư theo dõi', value:fmt(inv.length), color:'var(--label)',
    sub:(F.kho === 'Tất cả' ? '5 nguồn kho' : F.kho), bar:100});
  h += kpi({span:'span3', label:'Mã đã dùng hết tồn', value:fmt(hetDung), color:'var(--c4)',
    sub:'đã xuất hết · ' + fmt(chuaNhan) + ' mã chưa từng nhập kho', bar:pct(hetDung, inv.length)});
  h += kpi({span:'span3', label:'Người xuất kho', value:new Set(tx.map(x => x.person).filter(Boolean)).size, color:'var(--green)',
    sub:'trong ' + tx.length + ' phiếu gần nhất', bar:100});

  /* Theo nguồn kho — gộp bảng tồn nền + sổ phiếu WMS */
  const S = wmsBySource(), sk = S.map(x => x.k);
  h += card({span:'span5', title:'Nhập · xuất · tồn theo nguồn kho',
    body: legend([{k:'Đã nhận về', c:HEX[1]},{k:'Đã xuất dùng', c:HEX[3]},{k:'Còn lại', c:HEX[8]}])
      + barChart({labels: sk, series:[
        {name:'Đã nhận về', color:'var(--green)', data: S.map(x => x.nhap)},
        {name:'Đã xuất dùng', color:'var(--red)', data: S.map(x => x.xuat)},
        {name:'Còn lại', color:'var(--c9)', data: S.map(x => x.ton)}],
        vf: v => fmt(v), h:226, onClick:"setF('kho', $L)"})});

  /* Xuất theo ngày */
  const byDay = {}; tx.forEach(x => { if (!x.date) return;
    (byDay[x.date] = byDay[x.date] || {in:0, out:0}); byDay[x.date][x.type === 'in' ? 'in' : 'out']++; });
  const days = Object.keys(byDay).sort().slice(-30);
  h += card({span:'span7', title:'Nhịp nhập xuất 30 ngày gần nhất',
    body: legend([{k:'Phiếu nhập', c:HEX[1]},{k:'Phiếu xuất', c:HEX[0]}])
      + lineChart({labels: days.map(d => d.slice(8) + '/' + d.slice(5,7)),
        series:[{name:'Phiếu nhập', color:'var(--c2)', data: days.map(d => byDay[d].in), area:true},
                {name:'Phiếu xuất', color:'var(--c1)', data: days.map(d => byDay[d].out), area:true}],
        vf: v => fmt(v), h:214})});

  /* Top xuất */
  const agg = (DB.wms.agg || []).filter(x => (+x.outQty||0) > 0)
    .sort((a,b) => qtyM2(b.code, b.name, +b.outQty||0, b.unit).v - qtyM2(a.code, a.name, +a.outQty||0, a.unit).v)
    .slice(0, 25);
  h += card({span:'span6', title:'Top ' + agg.length + ' vật tư xuất nhiều nhất',
    body: hbarChart({
      items: agg.map(x => {
        const q = qtyM2(x.code, x.name, +x.outQty||0, x.unit), nv = m2NhanVe(x.name);
        return {k:(x.name || x.code), v:q.v, c:'var(--blue)', u:q.u,
          box: q.note ? fmt(+x.outQty||0) + ' thùng' : '',
          sub: normSrc(x.source) + (q.note ? ' · ' + q.note : '')
             + (nv ? ' · đã nhận ' + fmt(nv,1) + ' m²' : '')};
      }),
      vf: v => fmt(v, 0), unit:'Đã xuất', ml:146, mr:142, rh:24, h: 16 + agg.length * 24})});

  /* Bảng phiếu gần nhất */
  h += card({span:'span6', title:'Phiếu nhập xuất gần nhất', flush:true,
    body:'<div class="scroll tall">' + ftable({
        id:'txTbl', limit:200,
        rows: () => tx,
        onRow: x => "openTx(" + tx.indexOf(x) + ")",
        cols:[
          {k:'date', lb:'Ngày', get:x => x.date || '—',
           cell:x => '<span class="num" style="white-space:nowrap">' + dVN(x.date) + '</span>'},
          {k:'type', lb:'Loại', get:x => x.type === 'in' ? 'Nhập' : x.type === 'return' ? 'Đổi trả' : 'Xuất',
           cell:x => statTag(x.type === 'in' ? 'Nhập' : x.type === 'return' ? 'Đổi trả' : 'Xuất',
               x.type === 'in' ? 'ok' : x.type === 'return' ? 'warn' : 'info')},
          {k:'source', lb:'Nguồn', get:x => normSrc(x.source)},
          {k:'name', lb:'Vật tư', get:x => x.name || x.code,
           cell:x => '<span style="display:block;max-width:250px">' + esc(x.name || x.code) + '</span>'},
          {k:'qty', lb:'Số lượng', cls:'r', filter:false, get:x => x.qty,
           cell:x => { const q = qtyM2(x.code, x.name, x.qty, x.unit);
             return '<span class="num" style="font-weight:600;white-space:nowrap">' + fmt(q.v, q.u === 'm²' ? 1 : 0) + '</span>'
               + (q.note ? '<div style="font-size:11px;color:var(--label3);white-space:nowrap">(' + fmt(x.qty) + ' thùng)</div>' : ''); }},
          {k:'unit', lb:'ĐVT', get:x => qtyM2(x.code, x.name, x.qty, x.unit).u || '—',
           cell:x => '<span style="color:var(--label2);font-size:13px;white-space:nowrap">' + esc(qtyM2(x.code, x.name, x.qty, x.unit).u || '—') + '</span>'},
          {k:'person', lb:'Người nhận', get:x => x.person || '—'},
          {k:'area', lb:'Căn / khu vực', get:x => x.area || '—',
           cell:x => '<span class="num" style="font-size:13px;color:var(--label2)">' + esc(x.area||'—') + '</span>'}
        ]}) + '</div>'});

  const low = inv.filter(x => (+x.outQty||0) > 0).sort((a,b) => (+a.stock||0) - (+b.stock||0)).slice(0, 40);
  h += card({span:'span12', title:'Vật tư tồn thấp / đã hết', flush:true,
    body:'<div class="scroll"><table class="tbl"><thead><tr><th>Mã / tên</th><th>Nguồn</th><th>Nhóm</th>'
      + '<th>Đơn vị</th><th class="r">Đã nhập</th><th class="r">Đã xuất</th><th class="r">Tồn</th><th>Ghi chú</th></tr></thead><tbody>'
      + low.map(x => '<tr><td style="font-weight:600;font-size:11.5px;max-width:280px">' + esc(x.name || x.code) + '</td>'
        + '<td style="font-size:13px;color:var(--label2)">' + esc(normSrc(x.source)) + '</td>'
        + '<td style="font-size:13px;color:var(--label3)">' + esc(x.group||'—') + '</td>'
        + '<td style="font-size:13px;color:var(--label2);white-space:nowrap">' + esc(x.unit || '—') + '</td>'
        + '<td class="r num">' + fmt(x.inQty) + '</td><td class="r num">' + fmt(x.outQty) + '</td>'
        + '<td class="r num" style="font-weight:700;color:' + ((+x.stock||0) <= 0 ? 'var(--red)' : 'var(--label)') + '">' + fmt(x.stock) + '</td>'
        + '<td style="font-size:11px;color:var(--label2);max-width:220px">' + esc((x.note||'').slice(0,80)) + '</td></tr>').join('')
      + '</tbody></table></div>'});
  h += '</div>';
  return h;
}

/* ─────────────── 7 · ĐIỀU HÀNH & HỒ SƠ ─────────────── */
function pgOps(){
  const t = taskStats(), T = DB.tasks, hs = DB.constr.hoso;
  let h = '<div class="grid">';
  h += kpi({span:'span3', label:'Tổng công việc BCH', value:t.n, color:'var(--label)', sub:t.done + ' hoàn thành', bar:pct(t.done, t.n)});
  h += kpi({span:'span3', label:'Đang làm', value:t.doing, color:'var(--c1)', sub:t.todo + ' chưa bắt đầu', bar:pct(t.doing, t.n)});
  h += kpi({span:'span3', label:'Quá hạn', value:t.late, color:'var(--c4)', sub:'chưa xong mà đã qua deadline', bar:pct(t.late, t.n)});
  h += kpi({span:'span3', label:'Hồ sơ đang chờ duyệt', value:hs.reduce((s,x) => s+x.pending, 0), color:'var(--c3)',
    sub:hs.reduce((s,x) => s+x.reject, 0) + ' hồ sơ bị từ chối', bar:pct(hs.reduce((s,x)=>s+x.pending,0), hs.reduce((s,x)=>s+x.xong+x.pending+x.reject,0))});

  /* Theo người */
  const per = {}; T.forEach(x => { const k = x.person || '—';
    (per[k] = per[k] || {done:0, doing:0, todo:0}); per[k][x.status === 'Hoàn thành' ? 'done' : x.status === 'Đang làm' ? 'doing' : 'todo']++; });
  const pk = Object.keys(per).sort((a,b) => (per[b].done+per[b].doing+per[b].todo) - (per[a].done+per[a].doing+per[a].todo));
  h += card({span:'span7', title:'Công việc theo người phụ trách', sub:pk.length + ' thành viên ban chỉ huy',
    body: legend([{k:'Hoàn thành', c:HEX[1]},{k:'Đang làm', c:HEX[0]},{k:'Chưa làm', c:HEX[8]}])
      + barChart({labels: pk.map(k => k.replace(/^[A-Z]+ - /,'')), series:[
        {name:'Hoàn thành', color:'var(--c2)', data: pk.map(k => per[k].done)},
        {name:'Đang làm', color:'var(--c1)', data: pk.map(k => per[k].doing)},
        {name:'Chưa làm', color:'var(--c9)', data: pk.map(k => per[k].todo)}],
        stacked:true, vf: v => fmt(v), h:230})});

  const cat = {}; T.forEach(x => { const k = x.category || 'Khác'; cat[k] = (cat[k]||0)+1; });
  h += card({span:'span5', title:'Công việc theo hạng mục',
    body: donutChart({items: Object.keys(cat).map((k,i) => ({k, v:cat[k], c:HEX[i%9]})), center: String(t.n), centerSub:'việc', h:218})});

  h += card({span:'span5', title:'Hồ sơ đệ trình theo loại',
    body: legend([{k:'Xong / duyệt', c:HEX[1]},{k:'Đang chờ', c:HEX[2]},{k:'Bị từ chối', c:HEX[3]}])
      + barChart({labels: hs.map(x => x.loai), series:[
        {name:'Xong / duyệt', color:'var(--green)', data: hs.map(x => x.xong)},
        {name:'Đang chờ', color:'var(--orange)', data: hs.map(x => x.pending)},
        {name:'Bị từ chối', color:'var(--red)', data: hs.map(x => x.reject)}],
        stacked:true, vf: v => fmt(v), h:206})
      + '<table class="tbl" style="margin-top:6px"><thead><tr><th style="padding-left:0">Loại</th>'
      + '<th class="r">Tổng</th><th class="r">Xong</th><th class="r">Chờ</th><th class="r">Từ chối</th>'
      + '<th style="padding-right:0">Tỷ lệ xong</th></tr></thead><tbody>'
      + hs.map(x => '<tr class="clk" onclick="drillHoSo(\'' + esc(x.loai) + '\')">'
          + '<td style="font-weight:600;padding-left:0">' + esc(x.loai) + '</td>'
          + '<td class="r num">' + x.tong + '</td>'
          + '<td class="r num" style="color:var(--green)">' + x.xong + '</td>'
          + '<td class="r num" style="color:var(--orange)">' + x.pending + '</td>'
          + '<td class="r num" style="color:' + (x.reject ? 'var(--red)' : 'var(--label3)') + '">' + x.reject + '</td>'
          + '<td style="padding-right:0">' + dataBar(pct(x.xong, x.tong), 100,
              pct(x.xong, x.tong) >= 80 ? 'var(--green)' : pct(x.xong, x.tong) >= 50 ? 'var(--orange)' : 'var(--red)',
              pct(x.xong, x.tong) + '%') + '</td></tr>').join('')
      + '</tbody></table>'});

  h += card({span:'span7', title:'Công việc cần theo dõi', flush:true,
    body:(function(){
      const list = T.filter(x => x.status !== 'Hoàn thành' || (x.issue && String(x.issue).trim()))
        .sort((a,b) => String(a.deadline||'9').localeCompare(String(b.deadline||'9')));
      if (!list.length) return '<div class="empty">Không còn việc tồn — toàn bộ đã hoàn thành</div>';
      return '<div class="scroll tall"><table class="tbl"><thead><tr><th>Công việc</th><th>Phụ trách</th><th>Hạn</th><th class="c">Tiến độ</th><th>Trạng thái</th></tr></thead><tbody>'
        + list.map(x => { const dd = daysTo(x.deadline), xong = x.status === 'Hoàn thành';
          return '<tr class="clk" onclick="openTask(' + DB.tasks.indexOf(x) + ')"><td style="font-size:11.5px;max-width:280px;font-weight:600">' + esc(x.name)
            + (x.issue ? '<div style="color:var(--red);font-weight:400;margin-top:1px">' + esc(x.issue) + '</div>' : '') + '</td>'
            + '<td style="font-size:11px;color:var(--label2)">' + esc(x.person||'') + '</td>'
            + '<td class="num" style="white-space:nowrap;color:' + (!xong && dd != null && dd < 0 ? 'var(--red)' : 'var(--label2)') + '">'
            + dVN(x.deadline)
            + (xong
                ? '<div style="font-size:11px;color:var(--green)">' + (x.doneDate ? 'xong ' + dVN(x.doneDate) : 'đã xong') + '</div>'
                : (dd != null ? '<div style="font-size:11px">' + (dd < 0 ? 'trễ ' + (-dd) + ' ngày' : 'còn ' + dd + ' ngày') + '</div>' : ''))
            + '</td>'
            + '<td>' + dataBar(+x.progress||0, 100, 'var(--c1)', (+x.progress||0) + '%') + '</td>'
            + '<td>' + statTag(x.status || '—', x.status === 'Hoàn thành' ? 'ok' : x.status === 'Đang làm' ? 'info' : 'mute') + '</td></tr>'; }).join('')
        + '</tbody></table></div>'; })()});

  h += card({span:'span12', title:'Hồ sơ đệ trình — RFA · RFI · Chỉ thị SI · PMI', flush:true,
    body:'<div style="padding:2px 18px 12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap">'
      + '<span id="hsTbl_count" style="font-size:13px;color:var(--label2)">' + fmt(DB.hoso.length) + ' dòng</span>'
      + '<button class="tbtn" onclick="clearFT(\'hsTbl\')">Xoá lọc bảng</button>'
      + '</div>'
      + '<div class="scroll tall">' + ftable({
          id:'hsTbl', limit:400,

function jsonp(url, cbName){
  return new Promise((res, rej) => {
    const cb = cbName || ('shl_cb_' + Date.now() + '_' + Math.random().toString(36).slice(2));
    const sc = document.createElement('script');
    const done = ok => { clearTimeout(tm); try { delete window[cb]; } catch(e){ window[cb] = undefined; }
      if (sc.parentNode) sc.parentNode.removeChild(sc); };
    const tm = setTimeout(() => { done(); rej(new Error('Quá thời gian chờ')); }, 60000);
    window[cb] = d => { done(); res(d); };
    sc.onerror = () => { done(); rej(new Error('Không gọi được nguồn')); };
    sc.src = url.replace('__CB__', cb);
    document.body.appendChild(sc);
  });
}
function gvizJsonp(ssId, sheet){
  const cb = 'shl_gv_' + Date.now() + '_' + Math.floor(Math.random()*1e6);
  const url = 'https://docs.google.com/spreadsheets/d/' + ssId + '/gviz/tq?tqx=out:json;responseHandler:' + cb
            + '&sheet=' + encodeURIComponent(sheet) + '&t=' + Date.now();
  return jsonp(url, cb).then(d => gvizToRows((d && d.table) || {}));
}
/* Đọc theo gid — chắc chắn đúng tab, không phụ thuộc cách gõ tên */
function gvizGid(ssId, gid){
  const cb = 'shl_gg_' + Date.now() + '_' + Math.floor(Math.random()*1e6);
  const url = 'https://docs.google.com/spreadsheets/d/' + ssId + '/gviz/tq?tqx=out:json;responseHandler:' + cb
            + '&gid=' + gid + '&t=' + Date.now();
  return jsonp(url, cb).then(d => gvizToRows((d && d.table) || {}));
}

async function syncAll(manual){
  const btn = $('btnSync');
  btn.disabled = true; btn.textContent = 'Đang tải…';
  const done = [];

  /* 1 · Thanh toán (3 sheet) */
  try {
    const rs = await Promise.all(CFG.paySheets.map(s => gvizJsonp(CFG.paySheetId, s)));
    const map = {}; CFG.paySheets.forEach((s,i) => map[s] = rs[i]);
    const built = buildPay(map);
    if (built.ct.length || built.pmi.length){ DB.pay = built; SRC.pay.live = true; SRC.pay.ngay = nowStr(); done.push('Thanh toán'); }
  } catch(e){ SRC.pay.live = false; }

  /* 2 · Kho WMS */
  try {
    const d = await jsonp(CFG.wmsUrl + '?action=feed&secret=' + CFG.wmsSecret
      + '&parts=inv,agg,log&limit=1200&callback=__CB__&_=' + Date.now());
    if (d && d.ok){
      DB.wms.inv = d.inventory || DB.wms.inv;
      DB.wms.agg = d.agg || DB.wms.agg;
      DB.wms.tx  = d.transactions || DB.wms.tx;
      DB.wms.logTotal = d.logTotal || DB.wms.logTotal;
      SRC.wms.live = true; SRC.wms.ngay = nowStr(); done.push('Kho');
    }
  } catch(e){ SRC.wms.live = false; }

  /* 3 · Hồ sơ đệ trình: RFA · RFI · Chỉ thị SI */
  try {
    const hs = await Promise.all(CFG.hsSheets.map(n => gvizJsonp(CFG.paySheetId, n)));
    const m = {}; CFG.hsSheets.forEach((n,i) => m[n] = hs[i]);
    const rows = buildHoSoRows(m), b = hoSoSummary(rows);
    if (b.length){ DB.hoso = rows; DB.constr.hoso = b; SRC.hoso.live = true; SRC.hoso.ngay = nowStr(); done.push('Hồ sơ'); }
  } catch(e){ SRC.hoso.live = false; }

  /* 4 · Tiến độ 104 căn + ma trận nhà máy (cùng file Google Sheet dự án) */
  try {
    const vr = await gvizJsonp(CFG.projSs, CFG.shVilla);
    const vs = parseVillaSheet(vr);
    if (vs.length >= 50){ DB.constr.villas = vs; SRC.constr.live = true; SRC.constr.ngay = nowStr(); done.push('Tiến độ 104 căn'); }
  } catch(e){ SRC.constr.live = false; }
  try {
    const fr = await gvizJsonp(CFG.projSs, CFG.shFactory);
    const fp = parseFactoryMatrix(fr);
    if (fp.length > 500){ DB.factory.prods = fp; rebuildMocs(); SRC.factory.live = true; SRC.factory.ngay = nowStr(); done.push('Nhà máy'); }
  } catch(e){ SRC.factory.live = false; }

  /* 5 · Kế hoạch & nhân lực trên file dự án (nhóm · nhân lực · ramp-up · chi tiết) */
  try {
    const G = CFG.gidProj;
    const [rn, rl, rr, rc] = await Promise.all([
      gvizGid(CFG.projSs, G.nhom), gvizGid(CFG.projSs, G.nhanLuc),
      gvizGid(CFG.projSs, G.rampUp), gvizGid(CFG.projSs, G.chiTiet)]);
    let ok = false;
    const gn = parseNhomTC(rn);   if (gn.length){ DB.constr.groups = gn; ok = true; }
    const nl = parseNhanLuc(rl);  if (nl.plan.length){ DB.constr.mpWeeks = nl.wk; DB.constr.mpPlan = nl.plan; ok = true; }
    const ru = parseRampUp(rr);   if (ru.length){ DB.constr.ramp = ru; ok = true; }
    const ct = parseChiTiet(rc);
    if (ct.length){
      /* giữ lại kế hoạch T26–T30 từ file, chỉ thay phần trùng tuần */
      const w = {}; ct.forEach(x => w[x.w] = 1);
      DB.constr.sched = ct.concat((SNAP.construction.sched || []).filter(x => !w[x.w]));
      ok = true;
    }
    if (ok){ SRC.plan.live = true; SRC.plan.ngay = nowStr(); done.push('Kế hoạch'); }
  } catch(e){ SRC.plan.live = false; }

  /* 6 · Giao việc (cần http/https) */
  try {
    const r = await fetch(CFG.taskUrl, {cache:'no-store'});
    const j = await r.json();
    if (j && j.ok && j.tasks){
      DB.tasks = j.tasks.map(t => ({id:t.id, name:t.name, person:t.person, category:t.category, priority:t.priority,
        deadline:t.deadline, status:t.status, progress:t.progress, issue:t.issue, created:t.created, doneDate:t.doneDate}));
      SRC.tasks.live = true; SRC.tasks.ngay = nowStr(); done.push('Giao việc');
    }
  } catch(e){ SRC.tasks.live = false; }

  LAST_SYNC = nowStr();
  try { localStorage.setItem('shl_sync', LAST_SYNC); } catch(e){}
  btn.disabled = false;
  const live = Object.keys(SRC).filter(k => SRC[k].live).length;
  btn.innerHTML = '<span class="lv' + (live >= 5 ? '' : ' warn') + '"></span>Làm mới';
  btn.title = live + '/' + Object.keys(SRC).length + ' nguồn đọc trực tiếp · ' + nowStr();
  render();
  if (manual) toast(done.length ? 'Đã cập nhật: ' + done.join(' · ') : 'Không kết nối được hệ thống nguồn — vẫn hiển thị bản lưu', !done.length);
}
function nowStr(){
  const d = new Date(), p = n => String(n).padStart(2,'0');
  return p(d.getDate()) + '/' + p(d.getMonth()+1) + '/' + d.getFullYear() + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}

/* ══════════════════════════════════════════════════════════════
   KHỞI ĐỘNG
   ══════════════════════════════════════════════════════════════ */
(function init(){
  render();
  $('canvas').addEventListener('scroll', scrollSpy, {passive:true});
  syncAll(false);
  setInterval(() => syncAll(false), 180000);   // 3 phút

  /* Quay lại tab là kéo dữ liệu mới ngay (sửa sheet xong bấm sang là thấy) */
  let lastSync = Date.now();
  const refreshIfStale = () => {
    if (document.visibilityState !== 'visible') return;
    if (Date.now() - lastSync < 20000) return;      // tránh gọi dồn
    lastSync = Date.now(); syncAll(false);
  };
  document.addEventListener('visibilitychange', refreshIfStale);
  window.addEventListener('focus', refreshIfStale);
})();

</script>
